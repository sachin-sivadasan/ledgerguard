name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - marketing
          - frontend

jobs:
  # Run tests first
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

  # Deploy after tests pass
  deploy:
    name: Deploy to Hetzner
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/ledgerspear/repo
            git fetch origin main
            git reset --hard origin/main

            # Deploy backend
            cd /opt/ledgerspear/repo/backend
            /usr/local/go/bin/go build -o /opt/ledgerspear/bin/ledgerspear-api ./cmd/server
            sudo systemctl restart ledgerspear-api

            # Deploy marketing
            cd /opt/ledgerspear/repo/marketing/site
            npm ci
            npm run build
            sudo systemctl restart ledgerspear-marketing

            # Health checks
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            curl -f http://localhost:3000 || exit 1

            echo "Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed! Check the logs."

  # Deploy to GCP staging
  deploy-staging:
    name: Deploy to GCP Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ledgerspear
        run: |
          docker build -t $REGISTRY/backend:${{ github.sha }} \
                       -t $REGISTRY/backend:latest \
                       -f backend/Dockerfile backend/
          docker push $REGISTRY/backend:${{ github.sha }}
          docker push $REGISTRY/backend:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ledgerspear-api
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ledgerspear/backend:${{ github.sha }}

      - name: Health check
        run: |
          URL=$(gcloud run services describe ledgerspear-api \
            --region ${{ secrets.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service URL: $URL"
          sleep 10
          curl -f "$URL/health" || exit 1
          echo "Staging deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "Staging deployment failed! Check the logs."

  # Deploy Flutter web to Firebase Hosting
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    needs: test
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.component == 'frontend' || github.event.inputs.component == 'all' || github.event.inputs.component == '')

    defaults:
      run:
        working-directory: frontend/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web (production)
        run: flutter build web --release -t lib/main_prod.dart

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ledgerguard-c7557
          entryPoint: frontend/app
