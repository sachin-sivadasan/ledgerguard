type Query {
  # Subscriptions
  subscriptions(
    appId: ID!
    riskState: RiskState
    status: AppSubscriptionStatus
    domain: String
    limit: Int = 50
    offset: Int = 0
  ): AppSubscriptionConnection!

  subscription(id: ID!): AppSubscription

  # Metrics
  metrics(appId: ID!): Metrics!
  metricsTrend(appId: ID!, months: Int = 6, granularity: Granularity = DAILY): [DailySnapshot!]!

  # Store Health
  storeHealth(appId: ID!, domain: String!): StoreHealth!

  # Earnings
  earnings(appId: ID!): Earnings!

  # Transactions
  transactions(
    appId: ID!
    chargeType: ChargeType
    domain: String
    startDate: DateTime
    endDate: DateTime
    limit: Int = 50
    offset: Int = 0
  ): TransactionConnection!

  # Risk Summary
  riskSummary(appId: ID!): RiskSummary!

  # Apps
  apps: [App!]!
  app(id: ID!): App
}

type AppSubscription {
  id: ID!
  domain: String!
  shopName: String!
  plan: String
  status: AppSubscriptionStatus!
  riskState: RiskState!
  mrrCents: Int!
  currency: String!
  daysPastDue: Int
  lastPaymentDate: DateTime
  expectedNextCharge: DateTime
  billingInterval: BillingInterval!
  events(limit: Int = 10): [AppSubscriptionEvent!]!
}

type AppSubscriptionEvent {
  id: ID!
  eventType: String!
  fromStatus: String
  toStatus: String
  fromRiskState: String
  toRiskState: String
  reason: String
  occurredAt: DateTime!
}

type App {
  id: ID!
  name: String!
  partnerAppId: String!
  trackingEnabled: Boolean!
  installCount: Int!
}

type Metrics {
  activeMrrCents: Int!
  revenueAtRiskCents: Int!
  usageRevenueCents: Int!
  totalRevenueCents: Int!
  renewalSuccessRate: Float!
  safeCount: Int!
  oneCycleMissedCount: Int!
  twoCyclesMissedCount: Int!
  churnedCount: Int!
}

type StoreHealth {
  domain: String!
  shopName: String!
  isPaid: Boolean!
  riskState: RiskState!
  subscription: AppSubscription
  lastPaymentDate: DateTime
  daysPastDue: Int
}

type RiskSummary {
  totalSubscriptions: Int!
  safe: Int!
  oneCycleMissed: Int!
  twoCyclesMissed: Int!
  churned: Int!
  revenueAtRiskCents: Int!
  atRiskSubscriptions: [AppSubscription!]!
}

type DailySnapshot {
  date: DateTime!
  activeMrrCents: Int!
  renewalSuccessRate: Float!
  revenueAtRiskCents: Int!
  safeCount: Int!
  churnedCount: Int!
}

type Earnings {
  recurringCents: Int!
  usageCents: Int!
  oneTimeCents: Int!
  refundCents: Int!
  totalCents: Int!
}

type Transaction {
  id: ID!
  domain: String!
  shopName: String!
  chargeType: ChargeType!
  grossAmountCents: Int!
  netAmountCents: Int!
  currency: String!
  transactionDate: DateTime!
  subscriptionGid: String
  billingInterval: BillingInterval
}

type TransactionConnection {
  nodes: [Transaction!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

type AppSubscriptionConnection {
  nodes: [AppSubscription!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

enum RiskState {
  SAFE
  ONE_CYCLE_MISSED
  TWO_CYCLES_MISSED
  CHURNED
}

enum AppSubscriptionStatus {
  ACTIVE
  CANCELLED
  FROZEN
  PENDING
  UNINSTALLED
}

enum BillingInterval {
  MONTHLY
  ANNUAL
}

enum ChargeType {
  RECURRING
  USAGE
  ONE_TIME
  REFUND
}

enum Granularity {
  DAILY
  WEEKLY
  MONTHLY
}

scalar DateTime
