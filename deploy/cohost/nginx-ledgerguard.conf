# LedgerGuard vhost — APPEND to checkoutmate's nginx: /opt/checkoutmate/deploy/nginx.conf
# Proxies api.ledgerspear.com -> the ledgerguard-api container (shared docker network).
# After appending: docker exec checkoutmate-nginx-1 nginx -t && nginx -s reload

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name api.ledgerspear.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS, proxy to LedgerGuard backend by container name
server {
    listen 443 ssl;
    http2 on;
    server_name api.ledgerspear.com;

    ssl_certificate     /etc/letsencrypt/live/api.ledgerspear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ledgerspear.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://ledgerguard-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types application/json text/plain application/javascript;
}
