# LedgerGuard — production stack for Hetzner VPS
# Modeled on checkoutmate's docker-compose.prod.yml.
# Usage:
#   cp deploy/.env.example .env && edit .env
#   scp firebase-credentials.json to repo root (gitignored, mounted read-only)
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    container_name: ledgerguard-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ledgerguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ledgerguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ledgerguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: ledgerguard-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: ledgerguard-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      INTERNAL_KEY: "${INTERNAL_KEY}"
      # Database (points at the postgres service on the compose network)
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-ledgerguard}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-ledgerguard}"
      DB_SSLMODE: "disable"
      DB_MIGRATIONS_PATH: "/app/migrations"
      # Redis
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_DB: "0"
      # Firebase (service account file mounted below)
      FIREBASE_CREDENTIALS_FILE: "/app/firebase-credentials.json"
      # Shopify Partner API
      SHOPIFY_CLIENT_ID: "${SHOPIFY_CLIENT_ID}"
      SHOPIFY_CLIENT_SECRET: "${SHOPIFY_CLIENT_SECRET}"
      SHOPIFY_REDIRECT_URI: "${SHOPIFY_REDIRECT_URI:-https://api.ledgerspear.com/api/v1/integrations/shopify/callback}"
      SHOPIFY_SCOPES: "${SHOPIFY_SCOPES:-read_analytics}"
      SHOPIFY_PARTNER_API_URL: "${SHOPIFY_PARTNER_API_URL}"
      # Encryption (REUSE the existing key so encrypted data stays readable)
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY}"
      # OpenAI (AI chat)
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
      # Razorpay (billing)
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET}"
      RAZORPAY_STARTER_PLAN_ID: "${RAZORPAY_STARTER_PLAN_ID}"
      RAZORPAY_PRO_PLAN_ID: "${RAZORPAY_PRO_PLAN_ID}"
      # Queue / sync pipeline
      QUEUE_ENABLED: "${QUEUE_ENABLED:-true}"
      QUEUE_NUM_WORKERS: "${QUEUE_NUM_WORKERS:-3}"
      QUEUE_FULL_SYNC_WORKERS: "${QUEUE_FULL_SYNC_WORKERS:-1}"
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: ledgerguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    container_name: ledgerguard-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"

volumes:
  pgdata:
  redisdata:
  certbot-webroot:
