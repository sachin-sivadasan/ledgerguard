  <!-- ==================== SPECIAL: Dashboard Empty State ==================== -->
  <text x="40" y="1084" font-size="16" font-weight="bold" fill="#111827">Special Case: Dashboard</text>
  <text x="40" y="1104" font-size="12" fill="#6B7280">Dashboard does NOT use LgEmptyState — it shows LgOnboardingChecklist + placeholder $0 metric cards. See 04a-dashboard-empty.svg</text>

  <!-- ==================== ANNOTATIONS ==================== -->
  <rect x="40" y="1124" width="1360" height="72" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="60" y="1144" font-size="11" fill="#92400E">All 9 data screens share the same pattern: if (!hasApps) return LgPage(title, child: LgEmptyState(...)). No KPIs/filters/tables rendered.</text>
  <text x="60" y="1160" font-size="11" fill="#92400E">LgEmptyState widget: lg_empty_state.dart — vertically centered Column with icon (48px), heading (titleMedium bold), description (bodyMedium), FilledButton.</text>
  <text x="60" y="1176" font-size="11" fill="#92400E">The only exception is Dashboard, which shows LgOnboardingChecklist (3-step wizard) + placeholder metric cards instead of LgEmptyState. See 04a-dashboard-empty.svg.</text>
  <text x="60" y="1192" font-size="11" fill="#92400E">Settings screen has NO empty state — it always shows all sections regardless of app connection status.</text>
</svg>
