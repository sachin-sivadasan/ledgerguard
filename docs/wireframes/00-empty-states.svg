  <circle cx="555" cy="772" r="16" fill="#F3F4F6"/>
  <text x="555" y="778" text-anchor="middle" font-size="14" fill="#9CA3AF">&#128279;</text>
  <text x="555" y="802" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">No webhooks yet</text>
