<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Logo area above card -->
  <circle cx="720" cy="280" r="20" fill="#5C6AC4" opacity="0.15"/>
  <circle cx="720" cy="280" r="14" fill="#5C6AC4" opacity="0.3"/>
  <circle cx="720" cy="280" r="8" fill="#5C6AC4"/>
  <text x="720" y="318" text-anchor="middle" font-size="20" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>
  <text x="720" y="340" text-anchor="middle" font-size="13" fill="#6B7280">Revenue Intelligence Platform</text>

  <!-- White Card -->
  <rect x="520" y="370" width="400" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Card Heading -->
  <text x="720" y="412" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Reset your password</text>

  <!-- Description -->
  <text x="720" y="440" text-anchor="middle" font-size="13" fill="#6B7280">Enter your email address and we'll send you a reset link.</text>

  <!-- Email Label -->
  <text x="556" y="476" font-size="13" font-weight="500" fill="#111827">Email</text>
  <!-- Email Input -->
  <rect x="556" y="484" width="328" height="40" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="572" y="509" font-size="13" fill="#9CA3AF">you@example.com</text>

  <!-- Send Reset Link Button -->
  <rect x="556" y="544" width="328" height="42" rx="6" fill="#5C6AC4"/>
  <text x="720" y="570" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Send Reset Link</text>

  <!-- Back to Sign In Link -->
  <text x="720" y="618" text-anchor="middle" font-size="13" fill="#5C6AC4">Back to Sign in</text>
</svg>