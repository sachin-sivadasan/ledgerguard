<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="20" width="180" height="40" rx="4" fill="none"/>
  <text x="110" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>

  <!-- Nav Items -->
  <!-- Dashboard (Active) -->
  <rect x="12" y="80" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="24" y="88" width="16" height="16" rx="3" fill="#5C6AC4"/>
  <text x="52" y="101" font-size="13" font-weight="600" fill="#5C6AC4">Dashboard</text>

  <rect x="12" y="116" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="137" font-size="13" fill="#6B7280">Subscriptions</text>

  <rect x="12" y="152" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="173" font-size="13" fill="#6B7280">Stores</text>

  <rect x="12" y="188" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="209" font-size="13" fill="#6B7280">Transactions</text>

  <rect x="12" y="224" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="245" font-size="13" fill="#6B7280">Events</text>

  <rect x="12" y="260" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="281" font-size="13" fill="#6B7280">Webhooks</text>

  <rect x="12" y="296" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="317" font-size="13" fill="#6B7280">Risk</text>

  <rect x="12" y="332" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="353" font-size="13" fill="#6B7280">Analytics</text>

  <rect x="12" y="368" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="376" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="389" font-size="13" fill="#6B7280">Earnings</text>

  <rect x="12" y="404" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="425" font-size="13" fill="#6B7280">Apps</text>

  <rect x="12" y="440" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="461" font-size="13" fill="#6B7280">API Keys</text>

  <rect x="12" y="476" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="497" font-size="13" fill="#6B7280">Insights</text>

  <rect x="12" y="512" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="520" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="533" font-size="13" fill="#6B7280">Settings</text>

  <!-- ==================== CONTENT AREA ==================== -->

  <!-- Page Title -->
  <text x="260" y="40" font-size="24" font-weight="bold" fill="#111827">Dashboard</text>
  <text x="260" y="62" font-size="13" fill="#6B7280">Revenue intelligence overview</text>

  <!-- ==================== ONBOARDING CHECKLIST ==================== -->
  <rect x="260" y="84" width="880" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Rocket Icon (circle placeholder) -->
  <circle cx="700" cy="124" r="24" fill="#F0F1FF"/>
  <text x="700" y="132" text-anchor="middle" font-size="22">&#128640;</text>

  <!-- Heading -->
  <text x="700" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Get Started with LedgerGuard</text>
  <text x="700" y="192" text-anchor="middle" font-size="13" fill="#6B7280">Complete these steps to start tracking your revenue</text>

  <!-- Step 1 -->
  <rect x="380" y="214" width="520" height="36" rx="6" fill="#F0F1FF"/>
  <circle cx="400" cy="232" r="12" fill="#5C6AC4"/>
  <text x="400" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="422" y="237" font-size="13" font-weight="500" fill="#111827">Connect your Shopify Partner Account</text>
  <!-- Annotation -->
  <text x="910" y="237" font-size="10" fill="#9CA3AF" font-style="italic">Navigates to Settings</text>

  <!-- Step 2 -->
  <rect x="380" y="256" width="520" height="36" rx="6" fill="#F9FAFB"/>
  <circle cx="400" cy="274" r="12" fill="#E5E7EB"/>
  <text x="400" y="279" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B7280">2</text>
  <text x="422" y="279" font-size="13" font-weight="500" fill="#111827">Add your first app</text>
  <!-- "Go to Apps" button -->
  <rect x="790" y="262" width="90" height="24" rx="12" fill="#5C6AC4"/>
  <text x="835" y="279" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF">Go to Apps</text>

  <!-- Step 3 -->
  <rect x="380" y="298" width="520" height="36" rx="6" fill="#F9FAFB"/>
  <circle cx="400" cy="316" r="12" fill="#E5E7EB"/>
  <text x="400" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#6B7280">3</text>
  <text x="422" y="321" font-size="13" font-weight="500" fill="#111827">Wait for your first sync to complete</text>
  <!-- Annotation -->
  <text x="910" y="321" font-size="10" fill="#9CA3AF" font-style="italic">Auto-triggers after app added</text>

  <!-- ==================== PLACEHOLDER KPI CARDS ==================== -->
  <text x="260" y="400" font-size="14" font-weight="600" fill="#111827">Key Metrics</text>
  <text x="260" y="418" font-size="11" fill="#9CA3AF" font-style="italic">All cards show $0 / 0% placeholder values until first sync completes</text>

  <!-- Row 1: 3 KPI cards -->
  <!-- Card 1: MRR -->
  <rect x="260" y="432" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="460" font-size="12" fill="#6B7280">Monthly Recurring Revenue</text>
  <text x="280" y="494" font-size="26" font-weight="bold" fill="#D1D5DB">$0</text>
  <text x="340" y="494" font-size="12" fill="#D1D5DB">—</text>

  <!-- Card 2: Renewal Rate -->
  <rect x="560" y="432" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="580" y="460" font-size="12" fill="#6B7280">Renewal Rate</text>
  <text x="580" y="494" font-size="26" font-weight="bold" fill="#D1D5DB">0%</text>
  <text x="640" y="494" font-size="12" fill="#D1D5DB">—</text>

  <!-- Card 3: Revenue at Risk -->
  <rect x="860" y="432" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="880" y="460" font-size="12" fill="#6B7280">Revenue at Risk</text>
  <text x="880" y="494" font-size="26" font-weight="bold" fill="#D1D5DB">$0</text>
  <text x="940" y="494" font-size="12" fill="#D1D5DB">—</text>

  <!-- Row 2: 3 KPI cards -->
  <!-- Card 4: Usage Revenue -->
  <rect x="260" y="540" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="568" font-size="12" fill="#6B7280">Usage Revenue</text>
  <text x="280" y="602" font-size="26" font-weight="bold" fill="#D1D5DB">$0</text>
  <text x="340" y="602" font-size="12" fill="#D1D5DB">—</text>

  <!-- Card 5: Churned -->
  <rect x="560" y="540" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="580" y="568" font-size="12" fill="#6B7280">Churned Revenue</text>
  <text x="580" y="602" font-size="26" font-weight="bold" fill="#D1D5DB">$0</text>
  <text x="640" y="602" font-size="12" fill="#D1D5DB">—</text>

  <!-- Card 6: Total Revenue -->
  <rect x="860" y="540" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="880" y="568" font-size="12" fill="#6B7280">Total Revenue</text>
  <text x="880" y="602" font-size="26" font-weight="bold" fill="#D1D5DB">$0</text>
  <text x="940" y="602" font-size="12" fill="#D1D5DB">—</text>

  <!-- ==================== PLACEHOLDER SECONDARY WIDGETS ==================== -->
  <text x="260" y="668" font-size="14" font-weight="600" fill="#111827">Widgets</text>

  <!-- Empty widget placeholders (3 across) -->
  <rect x="260" y="682" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="730" text-anchor="middle" font-size="12" fill="#D1D5DB">No data yet</text>
  <text x="400" y="748" text-anchor="middle" font-size="10" fill="#D1D5DB">Revenue Trend</text>

  <rect x="560" y="682" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="700" y="730" text-anchor="middle" font-size="12" fill="#D1D5DB">No data yet</text>
  <text x="700" y="748" text-anchor="middle" font-size="10" fill="#D1D5DB">Risk Distribution</text>

  <rect x="860" y="682" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1000" y="730" text-anchor="middle" font-size="12" fill="#D1D5DB">No data yet</text>
  <text x="1000" y="748" text-anchor="middle" font-size="10" fill="#D1D5DB">Recent Events</text>

  <!-- ==================== ANNOTATIONS ==================== -->
  <rect x="260" y="804" width="880" height="78" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="280" y="824" font-size="11" fill="#92400E">Empty state shown when appsList.isEmpty. LgOnboardingChecklist widget with 3 numbered steps (CircleAvatar).</text>
  <text x="280" y="840" font-size="11" fill="#92400E">Step 1 completed state: green circle + checkmark. Steps unlock sequentially. "Go to Apps" button on Step 2 navigates to /apps.</text>
  <text x="280" y="856" font-size="11" fill="#92400E">All 6 KPI cards from DashboardRegistry render with $0/0% placeholder values. Secondary widgets show dashed-border empty states.</text>
  <text x="280" y="872" font-size="11" fill="#92400E">See 04-dashboard.svg for the populated state with real data.</text>
</svg>
