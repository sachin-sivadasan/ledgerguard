  <!-- Logo -->
  <rect x="20" y="20" width="180" height="40" fill="none"/>
  <text x="30" y="45" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>

  <!-- Nav Items -->
  <rect x="10" y="80" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="87" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="100" font-size="13" fill="#6B7280">Dashboard</text>

  <rect x="10" y="116" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="123" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="136" font-size="13" fill="#6B7280">Subscriptions</text>

  <!-- Stores (Active) -->
  <rect x="10" y="152" width="200" height="30" rx="6" fill="#F0F1FF"/>
  <rect x="20" y="159" width="16" height="16" rx="3" fill="#5C6AC4"/>
  <text x="44" y="172" font-size="13" font-weight="600" fill="#5C6AC4">Stores</text>

  <rect x="10" y="188" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="195" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="208" font-size="13" fill="#6B7280">Transactions</text>

  <rect x="10" y="224" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="231" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="244" font-size="13" fill="#6B7280">Events</text>

  <rect x="10" y="260" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="267" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="280" font-size="13" fill="#6B7280">Webhooks</text>

  <rect x="10" y="296" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="303" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="316" font-size="13" fill="#6B7280">Risk</text>

  <rect x="10" y="332" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="339" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="352" font-size="13" fill="#6B7280">Analytics</text>

  <rect x="10" y="368" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="375" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="388" font-size="13" fill="#6B7280">Earnings</text>

  <rect x="10" y="404" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="411" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="424" font-size="13" fill="#6B7280">Apps</text>

  <rect x="10" y="440" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="447" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="460" font-size="13" fill="#6B7280">API Keys</text>

  <rect x="10" y="476" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="483" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="496" font-size="13" fill="#6B7280">Insights</text>

  <rect x="10" y="512" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="519" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="532" font-size="13" fill="#6B7280">Settings</text>

  <!-- Content Area -->
  <!-- Back Arrow + Title -->
  <text x="260" y="40" font-size="18" fill="#5C6AC4" cursor="pointer">&#8592;</text>
  <text x="285" y="40" font-size="24" font-weight="bold" fill="#111827">acme-shop</text>
  <text x="285" y="62" font-size="13" fill="#6B7280">Store CRM</text>

  <!-- Summary Cards Row (3-column responsive) -->
  <!-- Overview Card -->
  <rect x="260" y="84" width="360" height="160" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="108" font-size="14" font-weight="600" fill="#111827">Overview</text>
  <line x1="280" y1="118" x2="600" y2="118" stroke="#E5E7EB" stroke-width="1"/>

  <text x="280" y="140" font-size="12" fill="#6B7280">Health Score</text>
  <text x="420" y="140" font-size="13" font-weight="500" fill="#111827">94%</text>

  <text x="280" y="160" font-size="12" fill="#6B7280">Lifetime Value</text>
  <text x="420" y="160" font-size="13" font-weight="500" fill="#111827">$1,240</text>

  <text x="280" y="180" font-size="12" fill="#6B7280">First Install</text>
  <text x="420" y="180" font-size="13" font-weight="500" fill="#111827">Jan 15, 2025</text>

  <text x="280" y="200" font-size="12" fill="#6B7280">Last Interaction</text>
  <text x="420" y="200" font-size="13" font-weight="500" fill="#111827">May 15, 2026</text>

  <text x="280" y="224" font-size="12" fill="#6B7280">Risk State</text>
  <rect x="420" y="212" width="44" height="20" rx="10" fill="#ECFDF5"/>
  <text x="430" y="226" font-size="11" fill="#059669">Safe</text>
  <!-- Annotation -->
  <text x="478" y="226" font-size="10" fill="#9CA3AF" font-style="italic">LgRiskBadge</text>

  <!-- Installed Apps Card -->
  <rect x="640" y="84" width="360" height="160" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="660" y="108" font-size="14" font-weight="600" fill="#111827">Installed Apps</text>
  <line x1="660" y1="118" x2="980" y2="118" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="660" y="132" width="16" height="16" rx="3" fill="#EEF2FF"/>
  <text x="668" y="144" text-anchor="middle" font-size="9" fill="#5C6AC4">&#9632;</text>
  <text x="686" y="144" font-size="13" fill="#111827">InventorySync Pro</text>

  <rect x="660" y="160" width="16" height="16" rx="3" fill="#EEF2FF"/>
  <text x="668" y="172" text-anchor="middle" font-size="9" fill="#5C6AC4">&#9632;</text>
  <text x="686" y="172" font-size="13" fill="#111827">ReviewBoost</text>

  <!-- Subscriptions Card (clickable rows) -->
  <rect x="1020" y="84" width="360" height="160" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1040" y="108" font-size="14" font-weight="600" fill="#111827">Subscriptions (2)</text>
  <line x1="1040" y1="118" x2="1360" y2="118" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Sub 1 (clickable) -->
  <text x="1040" y="142" font-size="13" fill="#111827">Pro Plan · $29.99/mo</text>
  <rect x="1040" y="150" width="50" height="18" rx="9" fill="#ECFDF5"/>
  <text x="1050" y="163" font-size="10" fill="#059669">Active</text>
  <rect x="1100" y="150" width="44" height="18" rx="9" fill="#ECFDF5"/>
  <text x="1108" y="163" font-size="10" fill="#059669">Safe</text>
  <text x="1354" y="155" font-size="14" fill="#9CA3AF">&#x203A;</text>

  <!-- Sub 2 (clickable) -->
  <text x="1040" y="190" font-size="13" fill="#111827">Basic Plan · $14.99/mo</text>
  <rect x="1040" y="198" width="50" height="18" rx="9" fill="#ECFDF5"/>
  <text x="1050" y="211" font-size="10" fill="#059669">Active</text>
  <rect x="1100" y="198" width="44" height="18" rx="9" fill="#ECFDF5"/>
  <text x="1108" y="211" font-size="10" fill="#059669">Safe</text>
  <text x="1354" y="203" font-size="14" fill="#9CA3AF">&#x203A;</text>
  <!-- Annotation -->
  <text x="1040" y="232" font-size="10" fill="#9CA3AF" font-style="italic">Clickable: navigates to /subscriptions/:id</text>
  <text x="1040" y="244" font-size="10" fill="#9CA3AF" font-style="italic">Shows Status + Risk badges</text>

  <!-- Timeline Section (dual source) -->
  <rect x="260" y="268" width="1120" height="340" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="298" font-size="14" font-weight="600" fill="#111827">Timeline</text>
  <!-- Annotation -->
  <text x="380" y="298" font-size="10" fill="#9CA3AF" font-style="italic">Prefers events system (EventsProvider); falls back to legacy timeline</text>
  <line x1="280" y1="310" x2="1360" y2="310" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Event 1: Subscription Activated -->
  <rect x="286" y="322" width="18" height="18" rx="4" fill="#ECFDF5"/>
  <text x="295" y="336" text-anchor="middle" font-size="10" fill="#059669">&#10003;</text>
  <text x="316" y="334" font-size="13" font-weight="500" fill="#111827">Subscription Activated</text>
  <rect x="470" y="322" width="76" height="18" rx="9" fill="#ECFDF5"/>
  <text x="508" y="335" text-anchor="middle" font-size="10" fill="#059669">ACTIVATED</text>
  <text x="316" y="352" font-size="12" fill="#6B7280">May 15, 2026</text>
  <line x1="280" y1="366" x2="1360" y2="366" stroke="#F3F4F6" stroke-width="1"/>

  <!-- Event 2: Usage Charge -->
  <rect x="286" y="378" width="18" height="18" rx="4" fill="#EEF2FF"/>
  <text x="295" y="392" text-anchor="middle" font-size="10" fill="#5C6AC4">&#9673;</text>
  <text x="316" y="390" font-size="13" font-weight="500" fill="#111827">Usage Charge</text>
  <rect x="418" y="378" width="56" height="18" rx="9" fill="#EEF2FF"/>
  <text x="446" y="391" text-anchor="middle" font-size="10" fill="#5C6AC4">USAGE</text>
  <text x="316" y="408" font-size="12" fill="#6B7280">May 10, 2026</text>
  <line x1="280" y1="422" x2="1360" y2="422" stroke="#F3F4F6" stroke-width="1"/>

  <!-- Event 3: App Installed -->
  <rect x="286" y="434" width="18" height="18" rx="4" fill="#ECFDF5"/>
  <text x="295" y="448" text-anchor="middle" font-size="10" fill="#059669">&#8595;</text>
  <text x="316" y="446" font-size="13" font-weight="500" fill="#111827">App Installed</text>
  <rect x="410" y="434" width="56" height="18" rx="9" fill="#ECFDF5"/>
  <text x="438" y="447" text-anchor="middle" font-size="10" fill="#059669">INSTALL</text>
  <text x="316" y="464" font-size="12" fill="#6B7280">Jan 15, 2025</text>
  <line x1="280" y1="478" x2="1360" y2="478" stroke="#F3F4F6" stroke-width="1"/>

  <!-- Event 4: Subscription Cancelled -->
  <rect x="286" y="490" width="18" height="18" rx="4" fill="#FEF2F2"/>
  <text x="295" y="504" text-anchor="middle" font-size="10" fill="#DC2626">&#10005;</text>
  <text x="316" y="502" font-size="13" font-weight="500" fill="#111827">Subscription Cancelled</text>
  <rect x="484" y="490" width="76" height="18" rx="9" fill="#FEF2F2"/>
  <text x="522" y="503" text-anchor="middle" font-size="10" fill="#DC2626">CANCELLED</text>
  <text x="316" y="520" font-size="12" fill="#6B7280">Jan 10, 2025</text>

  <!-- Responsive layout annotation -->
  <rect x="260" y="628" width="1120" height="36" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="280" y="650" font-size="11" fill="#92400E">Layout: 3-column at &gt;900px, stacked on mobile. Timeline badges match EventType from events_screen.dart (15 types).</text>
</svg>
