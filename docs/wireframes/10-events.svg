<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1000" fill="#F8F9FA"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="220" height="1000" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="1000" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="20" width="180" height="40" fill="none"/>
  <text x="30" y="45" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>

  <!-- Nav Items -->
  <rect x="10" y="80" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="87" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="100" font-size="13" fill="#6B7280">Dashboard</text>

  <rect x="10" y="116" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="123" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="136" font-size="13" fill="#6B7280">Subscriptions</text>

  <rect x="10" y="152" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="159" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="172" font-size="13" fill="#6B7280">Stores</text>

  <rect x="10" y="188" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="195" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="208" font-size="13" fill="#6B7280">Transactions</text>

  <!-- Events (Active) -->
  <rect x="10" y="224" width="200" height="30" rx="6" fill="#F0F1FF"/>
  <rect x="20" y="231" width="16" height="16" rx="3" fill="#5C6AC4"/>
  <text x="44" y="244" font-size="13" font-weight="600" fill="#5C6AC4">Events</text>

  <rect x="10" y="260" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="267" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="280" font-size="13" fill="#6B7280">Webhooks</text>

  <rect x="10" y="296" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="303" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="316" font-size="13" fill="#6B7280">Risk</text>

  <rect x="10" y="332" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="339" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="352" font-size="13" fill="#6B7280">Analytics</text>

  <rect x="10" y="368" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="375" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="388" font-size="13" fill="#6B7280">Earnings</text>

  <rect x="10" y="404" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="411" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="424" font-size="13" fill="#6B7280">Apps</text>

  <rect x="10" y="440" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="447" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="460" font-size="13" fill="#6B7280">API Keys</text>

  <rect x="10" y="476" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="483" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="496" font-size="13" fill="#6B7280">Insights</text>

  <rect x="10" y="512" width="200" height="30" rx="6" fill="none"/>
  <rect x="20" y="519" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="532" font-size="13" fill="#6B7280">Settings</text>

  <!-- Content Area -->
  <!-- Page Title -->
  <text x="260" y="40" font-size="24" font-weight="bold" fill="#111827">Events</text>
  <text x="260" y="62" font-size="13" fill="#6B7280">523 events</text>
  <!-- Refresh Button (LgPage.onRefresh → Icons.refresh) -->
  <circle cx="1120" cy="37" r="16" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1120" y="43" text-anchor="middle" font-size="16" fill="#6B7280">&#8635;</text>
  <!-- Annotation -->
  <text x="360" y="62" font-size="10" fill="#9CA3AF" font-style="italic">Dynamic total from API (or events.length in demo)</text>

  <!-- Segmented Control (Time Range) -->
  <rect x="260" y="78" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="262" y="80" width="104" height="30" rx="5" fill="#5C6AC4"/>
  <text x="292" y="100" font-size="12" font-weight="500" fill="#FFFFFF">Today</text>
  <text x="404" y="100" font-size="12" fill="#6B7280">This Week</text>
  <text x="510" y="100" font-size="12" fill="#6B7280">This Month</text>

  <!-- KPI Row (dynamic labels with time range) -->
  <rect x="260" y="128" width="215" height="70" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="152" font-size="12" fill="#6B7280">Installs Today</text>
  <text x="280" y="180" font-size="24" font-weight="bold" fill="#059669">12</text>

  <rect x="490" y="128" width="215" height="70" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="510" y="152" font-size="12" fill="#6B7280">Uninstalls Today</text>
  <text x="510" y="180" font-size="24" font-weight="bold" fill="#F59E0B">3</text>

  <rect x="720" y="128" width="215" height="70" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="740" y="152" font-size="12" fill="#6B7280">Churns Today</text>
  <text x="740" y="180" font-size="24" font-weight="bold" fill="#EF4444">1</text>

  <rect x="950" y="128" width="215" height="70" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="970" y="152" font-size="12" fill="#6B7280">Billing Failures Today</text>
  <text x="970" y="180" font-size="24" font-weight="bold" fill="#111827">0</text>

  <!-- Filter Bar -->
  <!-- Type filter (PopupMenu showing all 15 types) -->
  <rect x="260" y="218" width="100" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="278" y="236" font-size="12" fill="#6B7280">Type</text>
  <text x="346" y="236" font-size="10" fill="#6B7280">&#9660;</text>

  <!-- App filter (multi-app) -->
  <rect x="374" y="218" width="140" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="392" y="236" font-size="12" fill="#111827">Revenue Tracker</text>
  <text x="500" y="236" font-size="10" fill="#6B7280">&#9660;</text>
  <!-- Annotation -->
  <text x="374" y="258" font-size="9" fill="#9CA3AF" font-style="italic">PopupMenuButton: switch app (only shown when apps.length &gt; 1)</text>

  <!-- Search -->
  <rect x="528" y="218" width="200" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="546" y="236" font-size="12" fill="#9CA3AF">Search by store...</text>

  <text x="744" y="236" font-size="12" fill="#5C6AC4" cursor="pointer">Clear</text>

  <!-- Annotation: 15 event types -->
  <text x="810" y="236" font-size="10" fill="#9CA3AF" font-style="italic">15 event types: INSTALL, UNINSTALL, REACTIVATED, DEACTIVATED,</text>
  <text x="810" y="250" font-size="10" fill="#9CA3AF" font-style="italic">ACTIVATED, CANCELLED, FROZEN, UNFROZEN, UPGRADE, DOWNGRADE,</text>
  <text x="810" y="264" font-size="10" fill="#9CA3AF" font-style="italic">BILLING FAIL, BILLING OK, RISK CHANGE, REVIEW, USAGE</text>

  <!-- Event Cards -->
  <!-- Event 1: Install (green) -->
  <rect x="260" y="278" width="880" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="298" width="20" height="20" rx="4" fill="#ECFDF5"/>
  <text x="290" y="313" text-anchor="middle" font-size="11" fill="#059669">&#8595;</text>
  <text x="314" y="308" font-size="14" font-weight="600" fill="#111827">App Installed</text>
  <rect x="418" y="294" width="64" height="20" rx="10" fill="#ECFDF5"/>
  <text x="450" y="308" text-anchor="middle" font-size="11" fill="#059669">INSTALL</text>
  <text x="314" y="328" font-size="12" fill="#6B7280">Revenue Tracker Pro was installed on the store</text>
  <text x="314" y="346" font-size="12" fill="#9CA3AF">acme-shop  ·  May 19, 2026 – 2:15 PM</text>

  <!-- Event 2: Subscription Activated (green) -->
  <rect x="260" y="370" width="880" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="390" width="20" height="20" rx="4" fill="#ECFDF5"/>
  <text x="290" y="405" text-anchor="middle" font-size="11" fill="#059669">&#10003;</text>
  <text x="314" y="400" font-size="14" font-weight="600" fill="#111827">Subscription Activated</text>
  <rect x="482" y="386" width="80" height="20" rx="10" fill="#ECFDF5"/>
  <text x="522" y="400" text-anchor="middle" font-size="11" fill="#059669">ACTIVATED</text>
  <text x="314" y="420" font-size="12" fill="#6B7280">Pro plan activated at $29.99/mo</text>
  <text x="314" y="438" font-size="12" fill="#9CA3AF">best-widgets  ·  May 19, 2026 – 10:30 AM</text>

  <!-- Event 3: Uninstall (red) -->
  <rect x="260" y="462" width="880" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="482" width="20" height="20" rx="4" fill="#FEF2F2"/>
  <text x="290" y="497" text-anchor="middle" font-size="11" fill="#DC2626">&#10005;</text>
  <text x="314" y="492" font-size="14" font-weight="600" fill="#111827">App Uninstalled</text>
  <rect x="432" y="478" width="76" height="20" rx="10" fill="#FEF2F2"/>
  <text x="470" y="492" text-anchor="middle" font-size="11" fill="#DC2626">UNINSTALL</text>
  <text x="314" y="512" font-size="12" fill="#6B7280">Subscription Manager was uninstalled from the store</text>
  <text x="314" y="530" font-size="12" fill="#9CA3AF">fancy-threads  ·  May 18, 2026 – 4:22 PM</text>

  <!-- Event 4: Subscription Frozen (warning) -->
  <rect x="260" y="554" width="880" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="574" width="20" height="20" rx="4" fill="#FEF3C7"/>
  <text x="290" y="589" text-anchor="middle" font-size="11" fill="#D97706">&#10052;</text>
  <text x="314" y="584" font-size="14" font-weight="600" fill="#111827">Subscription Frozen</text>
  <rect x="464" y="570" width="60" height="20" rx="10" fill="#FEF3C7"/>
  <text x="494" y="584" text-anchor="middle" font-size="11" fill="#D97706">FROZEN</text>
  <text x="314" y="604" font-size="12" fill="#6B7280">Subscription was frozen due to payment failure</text>
  <text x="314" y="622" font-size="12" fill="#9CA3AF">old-store  ·  May 17, 2026 – 9:00 AM</text>

  <!-- Event 5: Billing Failure (critical) -->
  <rect x="260" y="646" width="880" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="666" width="20" height="20" rx="4" fill="#FEF2F2"/>
  <text x="290" y="681" text-anchor="middle" font-size="11" fill="#DC2626">!</text>
  <text x="314" y="676" font-size="14" font-weight="600" fill="#111827">Billing Failure</text>
  <rect x="414" y="662" width="86" height="20" rx="10" fill="#FEF2F2"/>
  <text x="457" y="676" text-anchor="middle" font-size="11" fill="#DC2626">BILLING FAIL</text>
  <text x="314" y="696" font-size="12" fill="#6B7280">Payment declined for Pro Plan renewal</text>
  <text x="314" y="714" font-size="12" fill="#9CA3AF">blue-ocean  ·  May 16, 2026 – 3:45 PM</text>

  <!-- Event 6: Usage Charge (info) -->
  <rect x="260" y="738" width="880" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="758" width="20" height="20" rx="4" fill="#EEF2FF"/>
  <text x="290" y="773" text-anchor="middle" font-size="11" fill="#5C6AC4">&#9673;</text>
  <text x="314" y="768" font-size="14" font-weight="600" fill="#111827">Usage Charge</text>
  <rect x="418" y="754" width="56" height="20" rx="10" fill="#EEF2FF"/>
  <text x="446" y="768" text-anchor="middle" font-size="11" fill="#5C6AC4">USAGE</text>
  <text x="314" y="788" font-size="12" fill="#6B7280">$42.50 usage charge billed</text>
  <text x="314" y="806" font-size="12" fill="#9CA3AF">mega-store  ·  May 15, 2026 – 11:20 AM</text>

  <!-- Load More Button -->
  <rect x="560" y="840" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#5C6AC4" stroke-width="1"/>
  <text x="620" y="863" text-anchor="middle" font-size="13" fill="#5C6AC4">Load More</text>
  <!-- Annotation -->
  <text x="700" y="863" font-size="10" fill="#9CA3AF" font-style="italic">Paginated (hasMore in live mode)</text>

  <!-- Empty filter state annotation -->
  <rect x="260" y="896" width="880" height="36" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="280" y="918" font-size="11" fill="#92400E">Empty filter state: filter_list_off icon + "No events match your filters" when events list empty.</text>
  <text x="280" y="932" font-size="11" fill="#92400E">Store domain shown stripped of .myshopify.com. Date format: "MMM d, y – h:mm a".</text>
</svg>
