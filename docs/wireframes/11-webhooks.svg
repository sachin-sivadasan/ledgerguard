  <rect x="280" y="296" width="32" height="32" rx="6" fill="#EEF2FF"/>
  <text x="296" y="317" text-anchor="middle" font-size="14" fill="#5C6AC4">↻</text>
  <text x="328" y="308" font-size="13" font-weight="600" fill="#111827">app/subscription_charge_accepted</text>
