  <!-- Event 4 -->
  <rect x="260" y="508" width="880" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="524" width="32" height="32" rx="6" fill="#EEF2FF"/>
  <text x="296" y="545" text-anchor="middle" font-size="14" fill="#5C6AC4">↻</text>
  <text x="328" y="536" font-size="13" font-weight="600" fill="#111827">app/uninstalled</text>
  <rect x="580" y="526" width="64" height="24" rx="12" fill="#ECFDF5"/>
