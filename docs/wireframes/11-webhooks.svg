  <rect x="580" y="374" width="56" height="24" rx="12" fill="#FEF2F2"/>
  <text x="608" y="391" text-anchor="middle" font-size="11" font-weight="500" fill="#DC2626">Failed</text>
  <rect x="648" y="374" width="64" height="24" rx="12" fill="#F3F4F6"/>
  <text x="680" y="391" text-anchor="middle" font-size="11" fill="#6B7280">Shopify</text>
  <text x="1100" y="391" text-anchor="end" font-size="12" fill="#6B7280">15 min ago</text>

  <!-- Event 3 -->
  <rect x="260" y="432" width="880" height="64" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="448" width="32" height="32" rx="6" fill="#EEF2FF"/>
  <text x="296" y="469" text-anchor="middle" font-size="14" fill="#5C6AC4">↻</text>
  <text x="328" y="460" font-size="13" font-weight="600" fill="#111827">app_subscriptions/update</text>
  <rect x="580" y="450" width="64" height="24" rx="12" fill="#ECFDF5"/>
  <text x="612" y="467" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">Success</text>
  <rect x="656" y="450" width="64" height="24" rx="12" fill="#F3F4F6"/>
  <text x="688" y="467" text-anchor="middle" font-size="11" fill="#6B7280">Shopify</text>
