  <rect x="280" y="122" width="572" height="28" rx="4" fill="#059669"/>
  <rect x="852" y="122" width="176" height="28" rx="0" fill="#F59E0B"/>
  <rect x="1028" y="122" width="88" height="28" rx="0" fill="#EA580C"/>
  <rect x="1116" y="122" width="44" height="28" rx="4" fill="#DC2626"/>
  <!-- Rounded right end only on last -->

  <!-- Funnel labels on bars -->
  <text x="566" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Safe (65%)</text>
  <text x="940" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">1-Cycle (20%)</text>
  <text x="1072" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">2-Cycle (10%)</text>
  <text x="1138" y="141" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">5%</text>

  <!-- Legend -->
  <rect x="280" y="164" width="10" height="10" rx="2" fill="#059669"/>
  <text x="296" y="174" font-size="11" fill="#6B7280">Safe</text>
  <rect x="340" y="164" width="10" height="10" rx="2" fill="#F59E0B"/>
  <text x="356" y="174" font-size="11" fill="#6B7280">1-Cycle Missed</text>
  <rect x="456" y="164" width="10" height="10" rx="2" fill="#EA580C"/>
  <text x="472" y="174" font-size="11" fill="#6B7280">2-Cycles Missed</text>
  <rect x="586" y="164" width="10" height="10" rx="2" fill="#DC2626"/>
  <text x="602" y="174" font-size="11" fill="#6B7280">Churned</text>

  <!-- At-Risk Stores Heading -->
  <text x="260" y="232" font-size="16" font-weight="600" fill="#111827">At-Risk Stores (15)</text>

  <!-- Store Card 1 -->
  <rect x="260" y="248" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
