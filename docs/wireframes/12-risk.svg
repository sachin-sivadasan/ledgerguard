  <text x="280" y="294" font-size="12" fill="#6B7280">Health: 42%</text>
  <text x="280" y="314" font-size="12" fill="#6B7280">LTV: $2,340</text>
  <rect x="420" y="260" width="100" height="24" rx="12" fill="#FEF3C7"/>
  <text x="470" y="277" text-anchor="middle" font-size="11" font-weight="500" fill="#D97706">1-Cycle Missed</text>

  <!-- Store Card 2 -->
  <rect x="560" y="248" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="580" y="274" font-size="14" font-weight="600" fill="#111827">Blue Ocean Store</text>
  <text x="580" y="294" font-size="12" fill="#6B7280">Health: 28%</text>
  <text x="580" y="314" font-size="12" fill="#6B7280">LTV: $5,120</text>
  <rect x="720" y="260" width="100" height="24" rx="12" fill="#FFEDD5"/>
  <text x="770" y="277" text-anchor="middle" font-size="11" font-weight="500" fill="#EA580C">2-Cycles Missed</text>

  <!-- Store Card 3 -->
  <rect x="860" y="248" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="880" y="274" font-size="14" font-weight="600" fill="#111827">Quick Commerce</text>
  <text x="880" y="294" font-size="12" fill="#6B7280">Health: 12%</text>
  <text x="880" y="314" font-size="12" fill="#6B7280">LTV: $890</text>
  <rect x="1020" y="260" width="100" height="24" rx="12" fill="#FEF2F2"/>
  <text x="1070" y="277" text-anchor="middle" font-size="11" font-weight="500" fill="#DC2626">Churned</text>

  <!-- Recovery Playbooks Heading -->
  <text x="260" y="388" font-size="16" font-weight="600" fill="#111827">Recovery Playbooks</text>

  <!-- Playbook Card 1 -->
  <rect x="260" y="404" width="430" height="180" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="432" font-size="15" font-weight="600" fill="#111827">Payment Recovery</text>
  <text x="280" y="452" font-size="12" fill="#6B7280">Re-engage stores with declined charges</text>
  <rect x="280" y="464" width="100" height="24" rx="12" fill="#ECFDF5"/>
  <text x="330" y="481" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">68% success</text>
  <text x="280" y="508" font-size="12" fill="#111827">Steps:</text>
  <text x="280" y="528" font-size="12" fill="#6B7280">1. Send payment reminder email</text>
  <text x="280" y="546" font-size="12" fill="#6B7280">2. Offer 7-day grace period</text>
  <text x="280" y="564" font-size="12" fill="#6B7280">3. Escalate to account manager</text>

  <!-- Playbook Card 2 -->
  <rect x="710" y="404" width="430" height="180" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="730" y="432" font-size="15" font-weight="600" fill="#111827">Churn Prevention</text>
  <text x="730" y="452" font-size="12" fill="#6B7280">Retain stores showing disengagement signals</text>
  <rect x="730" y="464" width="100" height="24" rx="12" fill="#ECFDF5"/>
  <text x="780" y="481" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">45% success</text>
  <text x="730" y="508" font-size="12" fill="#111827">Steps:</text>
  <text x="730" y="528" font-size="12" fill="#6B7280">1. Trigger usage review notification</text>
  <text x="730" y="546" font-size="12" fill="#6B7280">2. Offer plan downgrade option</text>
  <text x="730" y="564" font-size="12" fill="#6B7280">3. Schedule 1:1 support call</text>
