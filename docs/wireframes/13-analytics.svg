  <text x="580" y="610" font-size="26" font-weight="bold" fill="#111827">+4.2%</text>
  <text x="700" y="610" font-size="12" fill="#059669">+0.8pp</text>

  <!-- Card 3: Avg Transaction -->
  <rect x="860" y="550" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
