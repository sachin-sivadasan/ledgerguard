  <text x="1100" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">May</text>

  <!-- Metric Cards Row -->
  <!-- Card 1: Total Revenue -->
  <rect x="260" y="550" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="578" font-size="12" fill="#6B7280">Total Revenue</text>
  <text x="280" y="610" font-size="26" font-weight="bold" fill="#111827">$48,290</text>
