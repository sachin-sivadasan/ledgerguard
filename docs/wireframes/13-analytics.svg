  <text x="480" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">Aug</text>
  <text x="550" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">Sep</text>
  <text x="620" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">Oct</text>
  <text x="690" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">Nov</text>
  <text x="760" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">Dec</text>
  <text x="830" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">Jan</text>
  <text x="900" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">Feb</text>
  <text x="970" y="508" font-size="10" fill="#9CA3AF" text-anchor="middle">Mar</text>
