<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#F8F9FA"/>

  <!-- Header -->
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#111827">Analytics — Cohorts Tab</text>
  <text x="40" y="56" font-size="12" fill="#6B7280">Tab 4 of 5 in Analytics screen</text>

  <!-- Tab Bar -->
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="74" font-size="13" fill="#6B7280">Revenue</text>
  <text x="120" y="74" font-size="13" fill="#6B7280">Forecasting</text>
  <text x="230" y="74" font-size="13" fill="#6B7280">Profit &amp; Expense</text>
  <text x="370" y="74" font-size="13" font-weight="600" fill="#5C6AC4">Cohorts</text>
  <line x1="370" y1="80" x2="424" y2="80" stroke="#5C6AC4" stroke-width="2"/>
  <text x="440" y="74" font-size="13" fill="#6B7280">Multi-App</text>

  <!-- Cohort Retention Card -->
  <rect x="40" y="100" width="1120" height="320" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="128" font-size="14" font-weight="600" fill="#111827">Cohort Retention</text>
  <text x="60" y="146" font-size="10" fill="#9CA3AF" font-style="italic">Heatmap table: green intensity = retention % (darker = higher retention)</text>

  <!-- Table Header -->
  <rect x="60" y="158" width="1080" height="28" fill="#F3F4F6"/>
  <text x="80" y="177" font-size="11" font-weight="600" fill="#6B7280">Cohort</text>
  <text x="180" y="177" font-size="11" font-weight="600" fill="#6B7280">N</text>
  <text x="240" y="177" font-size="11" font-weight="600" fill="#6B7280">M0</text>
  <text x="320" y="177" font-size="11" font-weight="600" fill="#6B7280">M1</text>
  <text x="400" y="177" font-size="11" font-weight="600" fill="#6B7280">M2</text>
  <text x="480" y="177" font-size="11" font-weight="600" fill="#6B7280">M3</text>
  <text x="560" y="177" font-size="11" font-weight="600" fill="#6B7280">M4</text>
  <text x="640" y="177" font-size="11" font-weight="600" fill="#6B7280">M5</text>
  <text x="720" y="177" font-size="11" font-weight="600" fill="#6B7280">M6</text>

  <!-- Row 1: Jan 2026 -->
  <text x="80" y="210" font-size="12" fill="#111827">Jan 2026</text>
  <text x="180" y="210" font-size="12" fill="#111827">24</text>
  <!-- Heat cells -->
  <rect x="230" y="194" width="70" height="24" fill="rgba(5,150,105,0.30)"/>
  <text x="265" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">100%</text>
  <rect x="310" y="194" width="70" height="24" fill="rgba(5,150,105,0.27)"/>
  <text x="345" y="210" text-anchor="middle" font-size="12" fill="#111827">92%</text>
  <rect x="390" y="194" width="70" height="24" fill="rgba(5,150,105,0.24)"/>
  <text x="425" y="210" text-anchor="middle" font-size="12" fill="#111827">85%</text>
  <rect x="470" y="194" width="70" height="24" fill="rgba(5,150,105,0.22)"/>
  <text x="505" y="210" text-anchor="middle" font-size="12" fill="#111827">79%</text>
  <rect x="550" y="194" width="70" height="24" fill="rgba(5,150,105,0.20)"/>
  <text x="585" y="210" text-anchor="middle" font-size="12" fill="#111827">75%</text>
  <rect x="630" y="194" width="70" height="24" fill="rgba(5,150,105,0.18)"/>
  <text x="665" y="210" text-anchor="middle" font-size="12" fill="#111827">71%</text>
  <text x="745" y="210" font-size="12" fill="#9CA3AF">—</text>

  <!-- Row 2: Feb 2026 -->
  <text x="80" y="244" font-size="12" fill="#111827">Feb 2026</text>
  <text x="180" y="244" font-size="12" fill="#111827">18</text>
  <rect x="230" y="228" width="70" height="24" fill="rgba(5,150,105,0.30)"/>
  <text x="265" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">100%</text>
  <rect x="310" y="228" width="70" height="24" fill="rgba(5,150,105,0.26)"/>
  <text x="345" y="244" text-anchor="middle" font-size="12" fill="#111827">89%</text>
  <rect x="390" y="228" width="70" height="24" fill="rgba(5,150,105,0.23)"/>
  <text x="425" y="244" text-anchor="middle" font-size="12" fill="#111827">82%</text>
  <rect x="470" y="228" width="70" height="24" fill="rgba(5,150,105,0.20)"/>
  <text x="505" y="244" text-anchor="middle" font-size="12" fill="#111827">74%</text>
  <rect x="550" y="228" width="70" height="24" fill="rgba(5,150,105,0.18)"/>
  <text x="585" y="244" text-anchor="middle" font-size="12" fill="#111827">68%</text>
  <text x="665" y="244" font-size="12" fill="#9CA3AF">—</text>
  <text x="745" y="244" font-size="12" fill="#9CA3AF">—</text>

  <!-- Row 3: Mar 2026 -->
  <text x="80" y="278" font-size="12" fill="#111827">Mar 2026</text>
  <text x="180" y="278" font-size="12" fill="#111827">21</text>
  <rect x="230" y="262" width="70" height="24" fill="rgba(5,150,105,0.30)"/>
  <text x="265" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">100%</text>
  <rect x="310" y="262" width="70" height="24" fill="rgba(5,150,105,0.28)"/>
  <text x="345" y="278" text-anchor="middle" font-size="12" fill="#111827">95%</text>
  <rect x="390" y="262" width="70" height="24" fill="rgba(5,150,105,0.25)"/>
  <text x="425" y="278" text-anchor="middle" font-size="12" fill="#111827">88%</text>
  <rect x="470" y="262" width="70" height="24" fill="rgba(5,150,105,0.22)"/>
  <text x="505" y="278" text-anchor="middle" font-size="12" fill="#111827">80%</text>
  <text x="585" y="278" font-size="12" fill="#9CA3AF">—</text>
  <text x="665" y="278" font-size="12" fill="#9CA3AF">—</text>
  <text x="745" y="278" font-size="12" fill="#9CA3AF">—</text>

  <!-- Row 4: Apr 2026 -->
  <text x="80" y="312" font-size="12" fill="#111827">Apr 2026</text>
  <text x="180" y="312" font-size="12" fill="#111827">15</text>
  <rect x="230" y="296" width="70" height="24" fill="rgba(5,150,105,0.30)"/>
  <text x="265" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">100%</text>
  <rect x="310" y="296" width="70" height="24" fill="rgba(5,150,105,0.27)"/>
  <text x="345" y="312" text-anchor="middle" font-size="12" fill="#111827">93%</text>
  <rect x="390" y="296" width="70" height="24" fill="rgba(5,150,105,0.24)"/>
  <text x="425" y="312" text-anchor="middle" font-size="12" fill="#111827">86%</text>
  <text x="505" y="312" font-size="12" fill="#9CA3AF">—</text>
  <text x="585" y="312" font-size="12" fill="#9CA3AF">—</text>
  <text x="665" y="312" font-size="12" fill="#9CA3AF">—</text>
  <text x="745" y="312" font-size="12" fill="#9CA3AF">—</text>

  <!-- Row 5: May 2026 -->
  <text x="80" y="346" font-size="12" fill="#111827">May 2026</text>
  <text x="180" y="346" font-size="12" fill="#111827">19</text>
  <rect x="230" y="330" width="70" height="24" fill="rgba(5,150,105,0.30)"/>
  <text x="265" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">100%</text>
  <rect x="310" y="330" width="70" height="24" fill="rgba(5,150,105,0.28)"/>
  <text x="345" y="346" text-anchor="middle" font-size="12" fill="#111827">96%</text>
  <text x="425" y="346" font-size="12" fill="#9CA3AF">—</text>
  <text x="505" y="346" font-size="12" fill="#9CA3AF">—</text>
  <text x="585" y="346" font-size="12" fill="#9CA3AF">—</text>
  <text x="665" y="346" font-size="12" fill="#9CA3AF">—</text>
  <text x="745" y="346" font-size="12" fill="#9CA3AF">—</text>

  <!-- Annotations -->
  <rect x="40" y="436" width="1120" height="48" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="60" y="458" font-size="11" fill="#92400E">Heatmap table with green intensity proportional to retention %. Uses _HeatCell widget with LgColors.success at alpha * 0.3.</text>
  <text x="60" y="474" font-size="11" fill="#92400E">Scrollable horizontally on mobile. Columns: Cohort month, N (initial stores), then M0..Mn retention percentages. "—" for future months.</text>
</svg>
