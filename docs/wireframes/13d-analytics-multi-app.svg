<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#F8F9FA"/>

  <!-- Header -->
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#111827">Analytics — Multi-App Tab</text>
  <text x="40" y="56" font-size="12" fill="#6B7280">Tab 5 of 5 in Analytics screen</text>

  <!-- Tab Bar -->
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="74" font-size="13" fill="#6B7280">Revenue</text>
  <text x="120" y="74" font-size="13" fill="#6B7280">Forecasting</text>
  <text x="230" y="74" font-size="13" fill="#6B7280">Profit &amp; Expense</text>
  <text x="370" y="74" font-size="13" fill="#6B7280">Cohorts</text>
  <text x="440" y="74" font-size="13" font-weight="600" fill="#5C6AC4">Multi-App</text>
  <line x1="440" y1="80" x2="508" y2="80" stroke="#5C6AC4" stroke-width="2"/>

  <!-- App Comparison Table -->
  <rect x="40" y="100" width="1120" height="160" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="128" font-size="14" font-weight="600" fill="#111827">App Comparison</text>

  <!-- Table Header -->
  <rect x="60" y="140" width="1080" height="28" fill="#F3F4F6"/>
  <text x="80" y="159" font-size="11" font-weight="600" fill="#6B7280">App</text>
  <text x="400" y="159" font-size="11" font-weight="600" fill="#6B7280">Subs</text>
  <text x="560" y="159" font-size="11" font-weight="600" fill="#6B7280">MRR</text>
  <text x="720" y="159" font-size="11" font-weight="600" fill="#6B7280">At Risk</text>

  <!-- Row 1 -->
  <text x="80" y="188" font-size="13" fill="#111827">Revenue Tracker Pro</text>
  <text x="400" y="188" font-size="13" fill="#111827">42</text>
  <text x="560" y="188" font-size="13" fill="#111827">$8,400</text>
  <text x="720" y="188" font-size="13" fill="#111827">$1,200</text>

  <!-- Row 2 -->
  <text x="80" y="216" font-size="13" fill="#111827">Subscription Manager</text>
  <text x="400" y="216" font-size="13" fill="#111827">28</text>
  <text x="560" y="216" font-size="13" fill="#111827">$4,000</text>
  <text x="720" y="216" font-size="13" fill="#111827">$580</text>

  <!-- Row 3 -->
  <text x="80" y="244" font-size="13" fill="#111827">ShopMetrics</text>
  <text x="400" y="244" font-size="13" fill="#111827">15</text>
  <text x="560" y="244" font-size="13" fill="#111827">$2,100</text>
  <text x="720" y="244" font-size="13" fill="#111827">$0</text>

  <!-- Per-App MRR Cards -->
  <text x="40" y="296" font-size="14" font-weight="600" fill="#111827">Per-App MRR</text>

  <!-- Card 1 -->
  <rect x="40" y="310" width="350" height="110" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="336" font-size="14" font-weight="600" fill="#111827">Revenue Tracker Pro</text>
  <text x="60" y="368" font-size="24" font-weight="bold" fill="#111827">$8,400/mo</text>
  <rect x="60" y="382" width="12" height="12" rx="2" fill="#E5E7EB"/>
  <text x="78" y="393" font-size="11" fill="#6B7280">42 subscriptions</text>
  <rect x="60" y="400" width="12" height="12" rx="2" fill="#ECFDF5"/>
  <text x="78" y="411" font-size="11" fill="#059669">88% renewal</text>

  <!-- Card 2 -->
  <rect x="410" y="310" width="350" height="110" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="430" y="336" font-size="14" font-weight="600" fill="#111827">Subscription Manager</text>
  <text x="430" y="368" font-size="24" font-weight="bold" fill="#111827">$4,000/mo</text>
  <rect x="430" y="382" width="12" height="12" rx="2" fill="#E5E7EB"/>
  <text x="448" y="393" font-size="11" fill="#6B7280">28 subscriptions</text>
  <rect x="430" y="400" width="12" height="12" rx="2" fill="#ECFDF5"/>
  <text x="448" y="411" font-size="11" fill="#059669">82% renewal</text>

  <!-- Card 3 -->
  <rect x="780" y="310" width="350" height="110" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="800" y="336" font-size="14" font-weight="600" fill="#111827">ShopMetrics</text>
  <text x="800" y="368" font-size="24" font-weight="bold" fill="#111827">$2,100/mo</text>
  <rect x="800" y="382" width="12" height="12" rx="2" fill="#E5E7EB"/>
  <text x="818" y="393" font-size="11" fill="#6B7280">15 subscriptions</text>
  <rect x="800" y="400" width="12" height="12" rx="2" fill="#ECFDF5"/>
  <text x="818" y="411" font-size="11" fill="#059669">95% renewal</text>

  <!-- Annotations -->
  <rect x="40" y="440" width="1120" height="56" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="60" y="462" font-size="11" fill="#92400E">Comparison table (scrollable on mobile). Per-app MRR cards use responsive Wrap layout (1 col mobile, up to 4 cols desktop).</text>
  <text x="60" y="478" font-size="11" fill="#92400E">Empty state: "Connect multiple Shopify apps to compare performance across your portfolio." Renewal rate shown when &gt; 0.</text>
</svg>
