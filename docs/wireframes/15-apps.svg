  <rect x="1020" y="444" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#5C6AC4" stroke-width="1"/>
  <text x="1070" y="466" text-anchor="middle" font-size="12" font-weight="500" fill="#5C6AC4">Sync Now</text>
