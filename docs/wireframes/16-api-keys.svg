<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="20" width="180" height="40" rx="4" fill="none"/>
  <text x="110" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>

  <!-- Nav Items -->
  <rect x="12" y="80" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="88" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="101" font-size="13" fill="#6B7280">Dashboard</text>

  <rect x="12" y="116" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="137" font-size="13" fill="#6B7280">Subscriptions</text>

  <rect x="12" y="152" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="173" font-size="13" fill="#6B7280">Stores</text>

  <rect x="12" y="188" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="209" font-size="13" fill="#6B7280">Transactions</text>

  <rect x="12" y="224" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="245" font-size="13" fill="#6B7280">Events</text>

  <rect x="12" y="260" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="281" font-size="13" fill="#6B7280">Webhooks</text>

  <rect x="12" y="296" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="317" font-size="13" fill="#6B7280">Risk</text>

  <rect x="12" y="332" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="353" font-size="13" fill="#6B7280">Analytics</text>

  <rect x="12" y="368" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="376" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="389" font-size="13" fill="#6B7280">Earnings</text>

  <rect x="12" y="404" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="425" font-size="13" fill="#6B7280">Apps</text>

  <!-- API Keys (Active) -->
  <rect x="12" y="440" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="24" y="448" width="16" height="16" rx="3" fill="#5C6AC4"/>
  <text x="52" y="461" font-size="13" font-weight="600" fill="#5C6AC4">API Keys</text>

  <rect x="12" y="476" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="497" font-size="13" fill="#6B7280">Insights</text>

  <rect x="12" y="512" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="520" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="533" font-size="13" fill="#6B7280">Settings</text>

  <!-- ==================== CONTENT AREA ==================== -->

  <!-- Page Title + Action -->
  <text x="260" y="40" font-size="24" font-weight="bold" fill="#111827">API Keys</text>
  <text x="260" y="62" font-size="13" fill="#6B7280">2 active keys</text>

  <!-- Create API Key button -->
  <rect x="1000" y="20" width="140" height="38" rx="6" fill="#5C6AC4"/>
  <text x="1070" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">+ Create API Key</text>

  <!-- API Key Card 1: Production Key -->
  <rect x="260" y="90" width="880" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Header row -->
  <text x="280" y="122" font-size="16" font-weight="600" fill="#111827">Production Key</text>
  <rect x="430" y="106" width="56" height="24" rx="12" fill="#ECFDF5"/>
  <text x="458" y="123" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">Active</text>

  <!-- Key value (monospace) -->
  <rect x="280" y="140" width="400" height="34" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="296" y="162" font-size="13" fill="#374151" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">lgk_prod_abc...xyz</text>

  <!-- Metadata -->
  <text x="280" y="200" font-size="12" fill="#6B7280">Created: Jan 15, 2026</text>
  <text x="480" y="200" font-size="12" fill="#6B7280">Last used: Today</text>

  <!-- Permission badges -->
  <text x="280" y="232" font-size="12" fill="#6B7280">Permissions:</text>
  <rect x="360" y="218" width="44" height="22" rx="11" fill="#EEF2FF"/>
  <text x="382" y="233" text-anchor="middle" font-size="11" font-weight="500" fill="#5C6AC4">read</text>
  <rect x="414" y="218" width="44" height="22" rx="11" fill="#EEF2FF"/>
  <text x="436" y="233" text-anchor="middle" font-size="11" font-weight="500" fill="#5C6AC4">write</text>

  <!-- Divider -->
  <line x1="280" y="258" x2="1120" y2="258" stroke="#F3F4F6" stroke-width="1"/>

  <!-- API Key Card 2: Staging Key -->
  <rect x="260" y="310" width="880" height="220" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Header row -->
  <text x="280" y="342" font-size="16" font-weight="600" fill="#111827">Staging Key</text>
  <rect x="396" y="326" width="56" height="24" rx="12" fill="#ECFDF5"/>
  <text x="424" y="343" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">Active</text>

  <!-- Key value (monospace) -->
  <rect x="280" y="360" width="400" height="34" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="296" y="382" font-size="13" fill="#374151" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">lgk_stg_def...uvw</text>

  <!-- Metadata -->
  <text x="280" y="420" font-size="12" fill="#6B7280">Created: Mar 1, 2026</text>
  <text x="480" y="420" font-size="12" fill="#6B7280">Last used: Yesterday</text>

  <!-- Permission badges -->
  <text x="280" y="452" font-size="12" fill="#6B7280">Permissions:</text>
  <rect x="360" y="438" width="44" height="22" rx="11" fill="#EEF2FF"/>
  <text x="382" y="453" text-anchor="middle" font-size="11" font-weight="500" fill="#5C6AC4">read</text>
  <rect x="414" y="438" width="44" height="22" rx="11" fill="#EEF2FF"/>
  <text x="436" y="453" text-anchor="middle" font-size="11" font-weight="500" fill="#5C6AC4">write</text>
  <rect x="468" y="438" width="44" height="22" rx="11" fill="#EEF2FF"/>
  <text x="490" y="453" text-anchor="middle" font-size="11" font-weight="500" fill="#5C6AC4">sync</text>

  <!-- Revoke button -->
  <rect x="1000" y="470" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1"/>
  <text x="1050" y="492" text-anchor="middle" font-size="12" font-weight="500" fill="#DC2626">Revoke</text>
</svg>