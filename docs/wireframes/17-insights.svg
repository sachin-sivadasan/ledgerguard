<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="20" width="180" height="40" rx="4" fill="none"/>
  <text x="110" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>

  <!-- Nav Items -->
  <rect x="12" y="80" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="88" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="101" font-size="13" fill="#6B7280">Dashboard</text>

  <rect x="12" y="116" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="137" font-size="13" fill="#6B7280">Subscriptions</text>

  <rect x="12" y="152" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="173" font-size="13" fill="#6B7280">Stores</text>

  <rect x="12" y="188" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="209" font-size="13" fill="#6B7280">Transactions</text>

  <rect x="12" y="224" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="245" font-size="13" fill="#6B7280">Events</text>

  <rect x="12" y="260" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="281" font-size="13" fill="#6B7280">Webhooks</text>

  <rect x="12" y="296" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="317" font-size="13" fill="#6B7280">Risk</text>

  <rect x="12" y="332" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="353" font-size="13" fill="#6B7280">Analytics</text>

  <rect x="12" y="368" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="376" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="389" font-size="13" fill="#6B7280">Earnings</text>

  <rect x="12" y="404" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="425" font-size="13" fill="#6B7280">Apps</text>

  <rect x="12" y="440" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="461" font-size="13" fill="#6B7280">API Keys</text>

  <!-- Insights (Active) -->
  <rect x="12" y="476" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="24" y="484" width="16" height="16" rx="3" fill="#5C6AC4"/>
  <text x="52" y="497" font-size="13" font-weight="600" fill="#5C6AC4">Insights</text>

  <rect x="12" y="512" width="196" height="32" rx="6" fill="none"/>
  <rect x="24" y="520" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="52" y="533" font-size="13" fill="#6B7280">Settings</text>

  <!-- ==================== CONTENT AREA ==================== -->

  <!-- Page Title -->
  <text x="260" y="40" font-size="24" font-weight="bold" fill="#111827">AI Insights</text>
  <text x="260" y="62" font-size="13" fill="#6B7280">Daily briefs and revenue chat</text>
  <!-- Refresh Button (LgPage.onRefresh → Icons.refresh) -->
  <circle cx="1120" cy="37" r="16" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1120" y="43" text-anchor="middle" font-size="16" fill="#6B7280">&#8635;</text>

  <!-- Two-column layout -->
  <!-- Left Column: Daily Briefs (60%) -->
  <text x="260" y="100" font-size="16" font-weight="600" fill="#111827">Daily Briefs</text>

  <!-- Insight Card 1: INFO severity -->
  <rect x="260" y="116" width="528" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="132" width="16" height="16" rx="8" fill="#EFF6FF"/>
  <text x="288" y="144" text-anchor="middle" font-size="10" fill="#2563EB">i</text>
  <text x="308" y="144" font-size="14" font-weight="600" fill="#111827">MRR Growth Accelerating</text>
  <text x="700" y="144" font-size="11" fill="#6B7280">May 10, 10:32 AM</text>
  <text x="280" y="170" font-size="12" fill="#6B7280">Your MRR has grown 4.2% month-over-month, outpacing</text>
  <text x="280" y="186" font-size="12" fill="#6B7280">the previous quarter average of 2.8%. LedgerGuard Pro</text>
  <text x="280" y="202" font-size="12" fill="#6B7280">is the primary driver with 12 new subscriptions.</text>
  <!-- Annotation -->
  <text x="546" y="128" font-size="10" fill="#2563EB" font-style="italic">INFO severity (blue)</text>

  <!-- Insight Card 2: WARNING severity -->
  <rect x="260" y="228" width="528" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="244" width="16" height="16" rx="8" fill="#FEF3C7"/>
  <text x="288" y="256" text-anchor="middle" font-size="10" fill="#D97706">!</text>
  <text x="308" y="256" font-size="14" font-weight="600" fill="#111827">Churn Risk Detected</text>
  <text x="700" y="256" font-size="11" fill="#6B7280">May 9, 9:15 AM</text>
  <text x="280" y="282" font-size="12" fill="#6B7280">3 stores have missed payment cycles. Combined LTV at</text>
  <text x="280" y="298" font-size="12" fill="#6B7280">risk: $8,350. Recommend initiating recovery playbook</text>
  <text x="280" y="314" font-size="12" fill="#6B7280">within the next 7 days for optimal results.</text>
  <!-- Annotation -->
  <text x="504" y="240" font-size="10" fill="#D97706" font-style="italic">WARNING severity (amber)</text>

  <!-- Insight Card 3: CRITICAL severity -->
  <rect x="260" y="340" width="528" height="100" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="280" y="356" width="16" height="16" rx="8" fill="#FEF2F2"/>
  <text x="288" y="368" text-anchor="middle" font-size="10" fill="#DC2626">&#9888;</text>
  <text x="308" y="368" font-size="14" font-weight="600" fill="#111827">Revenue Drop Alert</text>
  <text x="700" y="368" font-size="11" fill="#6B7280">May 8, 3:00 PM</text>
  <text x="280" y="394" font-size="12" fill="#6B7280">Usage-based revenue dropped 15% week-over-week.</text>
  <text x="280" y="410" font-size="12" fill="#6B7280">Top contributor decline: ShopMetrics usage charges</text>
  <text x="280" y="426" font-size="12" fill="#6B7280">from high-volume stores fell from $2,100 to $1,785.</text>
  <!-- Annotation -->
  <text x="490" y="352" font-size="10" fill="#DC2626" font-style="italic">CRITICAL severity (red)</text>

  <!-- Right Column: Revenue Chat (40%) -->
  <text x="808" y="100" font-size="16" font-weight="600" fill="#111827">Ask about your revenue</text>

  <!-- Chat container -->
  <rect x="808" y="116" width="332" height="440" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- AI message 1 (left, gray bg) -->
  <rect x="824" y="132" width="260" height="72" rx="8" fill="#F3F4F6"/>
  <text x="840" y="152" font-size="12" fill="#111827">Your MRR grew 4.2% this month,</text>
  <text x="840" y="168" font-size="12" fill="#111827">reaching $12,400. This is your best</text>
  <text x="840" y="184" font-size="12" fill="#111827">growth rate in the last 6 months.</text>
  <text x="840" y="198" font-size="10" fill="#9CA3AF">AI  10:32 AM</text>

  <!-- User message (right, primary bg) -->
  <rect x="880" y="220" width="244" height="44" rx="8" fill="#5C6AC4"/>
  <text x="896" y="240" font-size="12" fill="#FFFFFF">Which stores are at risk?</text>
  <text x="1108" y="256" text-anchor="end" font-size="10" fill="rgba(255,255,255,0.7)">10:33 AM</text>

  <!-- AI message 2 (left, gray bg) -->
  <rect x="824" y="280" width="280" height="110" rx="8" fill="#F3F4F6"/>
  <text x="840" y="300" font-size="12" fill="#111827">3 stores have missed payments:</text>
  <text x="840" y="320" font-size="12" fill="#111827">1. Acme Widgets - 42 days late</text>
  <text x="840" y="340" font-size="12" fill="#111827">2. Blue Ocean - 58 days late</text>
  <text x="840" y="360" font-size="12" fill="#111827">3. Quick Commerce - 91 days late</text>
  <text x="840" y="380" font-size="10" fill="#9CA3AF">AI  10:33 AM</text>

  <!-- Input row -->
  <rect x="824" y="510" width="260" height="34" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="840" y="532" font-size="12" fill="#9CA3AF">Ask about revenue...</text>

  <!-- Send button -->
  <rect x="1092" y="510" width="34" height="34" rx="6" fill="#5C6AC4"/>
  <text x="1109" y="532" text-anchor="middle" font-size="14" fill="#FFFFFF">&#8594;</text>

  <!-- Responsive Layout Annotation -->
  <rect x="260" y="576" width="880" height="36" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="280" y="596" font-size="11" fill="#92400E">Responsive: Desktop = side-by-side (60/40 split via LgResponsive). Mobile = stacked (briefs first, chat below).</text>
  <text x="280" y="610" font-size="11" fill="#92400E">Severity icons: info_outline (blue), warning_amber (amber), error_outline (red). Date format: "MMM d, h:mm a".</text>
</svg>
