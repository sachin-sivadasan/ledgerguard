  <text x="280" y="876" font-size="13" fill="#111827">Timezone</text>
  <rect x="460" y="860" width="340" height="28" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="472" y="878" font-size="12" fill="#111827">America/New_York</text>
  <text x="784" y="878" font-size="10" fill="#9CA3AF">&#x25BC;</text>

  <!-- Scroll fade at bottom to indicate more content -->
  <defs>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F8F9FA" stop-opacity="0.9"/>
    </linearGradient>
