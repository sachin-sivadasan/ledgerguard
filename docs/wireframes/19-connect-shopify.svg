<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="20" width="180" height="40" fill="none"/>
  <text x="30" y="45" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>

  <!-- Nav Items -->
  <rect x="12" y="80" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="88" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="101" font-size="13" fill="#6B7280">Dashboard</text>

  <rect x="12" y="116" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="137" font-size="13" fill="#6B7280">Subscriptions</text>

  <rect x="12" y="152" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="173" font-size="13" fill="#6B7280">Stores</text>

  <rect x="12" y="188" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="209" font-size="13" fill="#6B7280">Transactions</text>

  <rect x="12" y="224" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="245" font-size="13" fill="#6B7280">Events</text>

  <rect x="12" y="260" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="281" font-size="13" fill="#6B7280">Webhooks</text>

  <rect x="12" y="296" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="317" font-size="13" fill="#6B7280">Risk</text>

  <rect x="12" y="332" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="353" font-size="13" fill="#6B7280">Analytics</text>

  <rect x="12" y="368" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="376" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="389" font-size="13" fill="#6B7280">Earnings</text>

  <rect x="12" y="404" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="425" font-size="13" fill="#6B7280">Apps</text>

  <rect x="12" y="440" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="461" font-size="13" fill="#6B7280">API Keys</text>

  <rect x="12" y="476" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="497" font-size="13" fill="#6B7280">Insights</text>

  <!-- Settings (Active) -->
  <rect x="12" y="512" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="20" y="520" width="16" height="16" rx="3" fill="#5C6AC4"/>
  <text x="44" y="533" font-size="13" font-weight="600" fill="#5C6AC4">Settings</text>

  <!-- Content Area -->
  <!-- Back Arrow -->
  <g transform="translate(260, 28)">
    <path d="M12 0 L0 10 L12 20" stroke="#6B7280" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Page Title -->
  <text x="290" y="44" font-size="24" font-weight="bold" fill="#111827">Connect Shopify</text>
  <text x="290" y="66" font-size="13" fill="#6B7280">Link your Shopify Partner account</text>

  <!-- OAuth Section Card -->
  <rect x="260" y="90" width="560" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Shield/Link Icon -->
  <g transform="translate(280, 114)">
    <rect width="40" height="40" rx="8" fill="#EEF0FB"/>
    <path d="M20 8 L10 14 L10 22 C10 28 14 32 20 34 C26 32 30 28 30 22 L30 14 Z" stroke="#5C6AC4" stroke-width="1.5" fill="none"/>
    <path d="M16 22 L19 25 L25 19" stroke="#5C6AC4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Heading + Badge -->
  <text x="332" y="132" font-size="16" font-weight="600" fill="#111827">Connect with OAuth</text>
  <!-- Recommended badge -->
  <rect x="492" y="118" width="100" height="22" rx="11" fill="#ECFDF5"/>
  <text x="512" y="133" font-size="11" font-weight="500" fill="#059669">Recommended</text>

  <!-- Description -->
  <text x="280" y="170" font-size="13" fill="#6B7280">Securely connect your Shopify Partner account using OAuth.</text>
  <text x="280" y="188" font-size="13" fill="#6B7280">This grants LedgerGuard read-only access to your revenue data.</text>
  <text x="280" y="206" font-size="13" fill="#6B7280">You can revoke access at any time from your Shopify dashboard.</text>

  <!-- Connect Button -->
  <rect x="280" y="230" width="520" height="40" rx="8" fill="#5C6AC4"/>
  <text x="460" y="255" font-size="14" font-weight="600" fill="#FFFFFF">Connect Shopify Partner</text>

  <!-- Manual Token Card -->
  <rect x="260" y="310" width="560" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Key Icon -->
  <g transform="translate(280, 334)">
    <rect width="40" height="40" rx="8" fill="#FEF3C7"/>
    <g transform="translate(10, 10)">
      <circle cx="7" cy="7" r="5" stroke="#D97706" stroke-width="1.5" fill="none"/>
      <line x1="12" y1="7" x2="20" y2="7" stroke="#D97706" stroke-width="1.5"/>
      <line x1="16" y1="7" x2="16" y2="11" stroke="#D97706" stroke-width="1.5"/>
      <line x1="19" y1="7" x2="19" y2="10" stroke="#D97706" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Heading + Badge -->
  <text x="332" y="352" font-size="16" font-weight="600" fill="#111827">Manual Token Entry</text>
  <!-- Admin/Dev badge -->
  <rect x="492" y="338" width="90" height="22" rx="11" fill="#FEF3C7"/>
  <text x="506" y="353" font-size="11" font-weight="500" fill="#D97706">Admin / Dev</text>

  <!-- Partner ID Input -->
  <text x="280" y="400" font-size="13" font-weight="500" fill="#111827">Partner ID</text>
  <rect x="280" y="408" width="520" height="40" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="296" y="433" font-size="13" fill="#9CA3AF">Enter your Shopify Partner ID</text>

  <!-- API Token Input -->
  <text x="280" y="472" font-size="13" font-weight="500" fill="#111827">API Token</text>
  <rect x="280" y="480" width="520" height="40" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="296" y="505" font-size="13" fill="#9CA3AF">Enter your API token</text>

  <!-- Save Button -->
  <rect x="280" y="536" width="520" height="40" rx="8" fill="#5C6AC4"/>
  <text x="510" y="561" font-size="14" font-weight="600" fill="#FFFFFF">Save Token</text>
</svg>