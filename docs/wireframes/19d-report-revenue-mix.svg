  <rect x="24" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="317" font-size="13" fill="#6B7280">Risk</text>
  <rect x="24" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="353" font-size="13" fill="#6B7280">Analytics</text>
  <rect x="12" y="368" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="24" y="376" width="16" height="16" rx="3" fill="#5C6AC4"/><text x="52" y="389" font-size="13" font-weight="600" fill="#5C6AC4">Reports</text>
  <rect x="24" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="425" font-size="13" fill="#6B7280">Earnings</text>
  <rect x="24" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="461" font-size="13" fill="#6B7280">Apps</text>
  <rect x="24" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="497" font-size="13" fill="#6B7280">API Keys</text>
  <rect x="24" y="520" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="533" font-size="13" fill="#6B7280">Insights</text>
  <rect x="24" y="556" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="569" font-size="13" fill="#6B7280">Settings</text>

  <!-- ==================== CONTENT ==================== -->
  <!-- Breadcrumb + title -->
  <text x="260" y="30" font-size="11" fill="#9CA3AF">Reports  ›  Revenue &amp; Billing</text>
  <text x="260" y="54" font-size="24" font-weight="bold" fill="#111827">Revenue Mix</text>
  <text x="260" y="76" font-size="13" fill="#6B7280">Composition of revenue by charge type — RECURRING vs USAGE vs ONE-TIME</text>

  <!-- Date range + Export + refresh (top-right) -->
  <rect x="1040" y="30" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1058" y="48" font-size="12" fill="#111827">Last 30 days ▾</text>
  <rect x="1204" y="30" width="120" height="28" rx="6" fill="#5C6AC4"/>
  <text x="1264" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF">Export CSV</text>
  <circle cx="1352" cy="44" r="16" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1352" y="50" text-anchor="middle" font-size="16" fill="#6B7280">&#8635;</text>

  <!-- App filter chip -->
  <rect x="260" y="92" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="278" y="110" font-size="12" fill="#111827">Revenue Tracker Pro ▾</text>

  <!-- Composition card (left) -->
  <rect x="260" y="132" width="540" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="284" y="162" font-size="14" font-weight="600" fill="#111827">Revenue Composition</text>
  <text x="284" y="180" font-size="11" fill="#9CA3AF" font-style="italic">stacked bar — composition archetype</text>

  <!-- stacked bar -->
  <rect x="284" y="210" width="492" height="44" rx="6" fill="#5C6AC4"/>
  <rect x="284" y="210" width="335" height="44" fill="#5C6AC4"/>
  <rect x="619" y="210" width="118" height="44" fill="#D97706"/>
  <rect x="737" y="210" width="39" height="44" rx="0" fill="#059669"/>
  <text x="290" y="237" font-size="12" font-weight="600" fill="#FFFFFF">68%</text>

  <!-- legend -->
  <rect x="284" y="290" width="14" height="14" rx="3" fill="#5C6AC4"/><text x="306" y="302" font-size="13" fill="#111827">Recurring</text><text x="500" y="302" font-size="13" font-weight="500" fill="#111827">68%</text>
  <rect x="284" y="322" width="14" height="14" rx="3" fill="#D97706"/><text x="306" y="334" font-size="13" fill="#111827">Usage</text><text x="500" y="334" font-size="13" font-weight="500" fill="#111827">24%</text>
  <rect x="284" y="354" width="14" height="14" rx="3" fill="#059669"/><text x="306" y="366" font-size="13" fill="#111827">One-time</text><text x="500" y="366" font-size="13" font-weight="500" fill="#111827">8%</text>

  <text x="284" y="466" font-size="11" fill="#9CA3AF" font-style="italic">RECURRING vs USAGE strictly separated —</text>
  <text x="284" y="482" font-size="11" fill="#9CA3AF" font-style="italic">MRR uses RECURRING only, Usage Revenue uses USAGE only.</text>

  <!-- Breakdown table (right) -->
  <rect x="820" y="132" width="580" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="844" y="162" font-size="14" font-weight="600" fill="#111827">Breakdown</text>

  <rect x="844" y="184" width="532" height="34" rx="8" fill="#F3F4F6"/>
  <text x="864" y="206" font-size="11" font-weight="600" fill="#6B7280">TYPE</text>
  <text x="1120" y="206" font-size="11" font-weight="600" fill="#6B7280">AMOUNT</text>
  <text x="1280" y="206" font-size="11" font-weight="600" fill="#6B7280">%</text>

  <line x1="844" y1="256" x2="1376" y2="256" stroke="#F3F4F6" stroke-width="1"/>
  <rect x="864" y="234" width="10" height="10" fill="#5C6AC4"/>
  <text x="884" y="244" font-size="13" font-weight="500" fill="#111827">Recurring</text>
  <text x="1120" y="244" font-size="13" fill="#111827">$12,480</text>
  <text x="1280" y="244" font-size="13" fill="#6B7280">68%</text>

  <line x1="844" y1="296" x2="1376" y2="296" stroke="#F3F4F6" stroke-width="1"/>
  <rect x="864" y="274" width="10" height="10" fill="#D97706"/>
  <text x="884" y="284" font-size="13" font-weight="500" fill="#111827">Usage</text>
  <text x="1120" y="284" font-size="13" fill="#111827">$4,405</text>
  <text x="1280" y="284" font-size="13" fill="#6B7280">24%</text>

  <line x1="844" y1="336" x2="1376" y2="336" stroke="#F3F4F6" stroke-width="1"/>
  <rect x="864" y="314" width="10" height="10" fill="#059669"/>
  <text x="884" y="324" font-size="13" font-weight="500" fill="#111827">One-time</text>
  <text x="1120" y="324" font-size="13" fill="#111827">$1,468</text>
  <text x="1280" y="324" font-size="13" fill="#6B7280">8%</text>

  <line x1="844" y1="378" x2="1376" y2="378" stroke="#E5E7EB" stroke-width="1"/>
  <text x="884" y="366" font-size="13" font-weight="700" fill="#111827">Total</text>
  <text x="1120" y="366" font-size="13" font-weight="700" fill="#111827">$18,353</text>
  <text x="1280" y="366" font-size="13" font-weight="700" fill="#111827">100%</text>

  <!-- annotations -->
  <text x="260" y="560" font-size="10" fill="#9CA3AF" font-style="italic">Archetype B (Composition). Segmented by ChargeType — RECURRING vs USAGE strictly separated (never mixed).</text>
  <text x="260" y="576" font-size="10" fill="#9CA3AF" font-style="italic">Source: daily snapshot aggregates by charge_type. Refund adjustments applied to gross before %.</text>
  <text x="260" y="592" font-size="10" fill="#9CA3AF" font-style="italic">Standards: LgPage header (title/subtitle/refresh), app filter chip, cards rx=8 stroke #E5E7EB, color tokens.</text>
</svg>
