  <!-- annotations -->
  <text x="260" y="590" font-size="10" fill="#9CA3AF" font-style="italic">Archetype B (Composition). Active = status ACTIVE. ARPU = MRR ÷ active subs; LTV = ARPU ÷ monthly churn rate.</text>
