<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>
  <text x="110" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>
  <rect x="24" y="88" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="101" font-size="13" fill="#6B7280">Dashboard</text>
  <rect x="24" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="137" font-size="13" fill="#6B7280">Subscriptions</text>
  <rect x="24" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="173" font-size="13" fill="#6B7280">Stores</text>
  <rect x="24" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="209" font-size="13" fill="#6B7280">Transactions</text>
  <rect x="24" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="245" font-size="13" fill="#6B7280">Events</text>
  <rect x="24" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="281" font-size="13" fill="#6B7280">Webhooks</text>
  <rect x="24" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="317" font-size="13" fill="#6B7280">Risk</text>
  <rect x="24" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="353" font-size="13" fill="#6B7280">Analytics</text>
  <rect x="12" y="368" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="24" y="376" width="16" height="16" rx="3" fill="#5C6AC4"/><text x="52" y="389" font-size="13" font-weight="600" fill="#5C6AC4">Reports</text>
  <rect x="24" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="425" font-size="13" fill="#6B7280">Earnings</text>
  <rect x="24" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="461" font-size="13" fill="#6B7280">Apps</text>
  <rect x="24" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="497" font-size="13" fill="#6B7280">API Keys</text>
  <rect x="24" y="520" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="533" font-size="13" fill="#6B7280">Insights</text>
  <rect x="24" y="556" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="569" font-size="13" fill="#6B7280">Settings</text>

  <!-- ==================== CONTENT ==================== -->
  <!-- Breadcrumb + title -->
  <text x="260" y="30" font-size="11" fill="#9CA3AF">Reports  ›  Retention &amp; Feedback</text>
  <text x="260" y="54" font-size="24" font-weight="bold" fill="#111827">Reviews</text>
  <text x="260" y="76" font-size="13" fill="#6B7280">App Store ratings — distribution, average, and most recent feedback</text>

  <!-- Date range + Export + refresh (top-right) -->
  <rect x="1040" y="30" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1058" y="48" font-size="12" fill="#111827">Last 30 days ▾</text>
  <rect x="1204" y="30" width="120" height="28" rx="6" fill="#5C6AC4"/>
  <text x="1264" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF">Export CSV</text>
  <circle cx="1352" cy="44" r="16" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1352" y="50" text-anchor="middle" font-size="16" fill="#6B7280">&#8635;</text>

  <!-- App filter chip -->
  <rect x="260" y="92" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="278" y="110" font-size="12" fill="#111827">Revenue Tracker Pro ▾</text>

  <!-- Left: rating distribution card -->
  <rect x="260" y="132" width="500" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="284" y="176" font-size="48" font-weight="700" fill="#111827">4.6</text>
  <text x="384" y="176" font-size="28" fill="#D97706">★</text>
  <text x="284" y="202" font-size="13" fill="#6B7280">128 reviews</text>

  <!-- distribution bars -->
  <!-- 5 star -->
  <text x="284" y="248" font-size="12" fill="#6B7280">5 ★</text>
  <rect x="330" y="238" width="340" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="330" y="238" width="276" height="14" rx="7" fill="#059669"/>
  <text x="686" y="249" font-size="12" fill="#6B7280">88</text>
  <!-- 4 star -->
  <text x="284" y="284" font-size="12" fill="#6B7280">4 ★</text>
  <rect x="330" y="274" width="340" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="330" y="274" width="88" height="14" rx="7" fill="#059669"/>
  <text x="686" y="285" font-size="12" fill="#6B7280">24</text>
  <!-- 3 star -->
  <text x="284" y="320" font-size="12" fill="#6B7280">3 ★</text>
  <rect x="330" y="310" width="340" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="330" y="310" width="34" height="14" rx="7" fill="#D97706"/>
  <text x="686" y="321" font-size="12" fill="#6B7280">9</text>
  <!-- 2 star -->
  <text x="284" y="356" font-size="12" fill="#6B7280">2 ★</text>
  <rect x="330" y="346" width="340" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="330" y="346" width="16" height="14" rx="7" fill="#EA580C"/>
  <text x="686" y="357" font-size="12" fill="#6B7280">4</text>
  <!-- 1 star -->
  <text x="284" y="392" font-size="12" fill="#6B7280">1 ★</text>
  <rect x="330" y="382" width="340" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="330" y="382" width="12" height="14" rx="7" fill="#DC2626"/>
  <text x="686" y="393" font-size="12" fill="#6B7280">3</text>

  <text x="284" y="446" font-size="11" fill="#9CA3AF" font-style="italic">Distribution across all 128 published reviews</text>
  <text x="284" y="486" font-size="10" fill="#9CA3AF" font-style="italic">Archetype G (list + sentiment). Data: from app_review.</text>

  <!-- Right: recent reviews list -->
  <rect x="780" y="132" width="620" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="804" y="162" font-size="14" font-weight="600" fill="#111827">Recent Reviews</text>

  <!-- review 1 -->
  <line x1="804" y1="182" x2="1376" y2="182" stroke="#F3F4F6" stroke-width="1"/>
  <text x="804" y="212" font-size="14" fill="#D97706">★★★★★</text>
  <text x="1000" y="212" font-size="11" fill="#9CA3AF">Jul 21</text>
  <text x="804" y="234" font-size="13" fill="#111827">"Cleaned up our MRR reporting overnight. Exactly what we needed."</text>
  <text x="804" y="254" font-size="11" fill="#6B7280">acme-widgets.myshopify.com</text>

  <!-- review 2 -->
  <line x1="804" y1="278" x2="1376" y2="278" stroke="#F3F4F6" stroke-width="1"/>
  <text x="804" y="308" font-size="14" fill="#D97706">★★★★<tspan fill="#E5E7EB">★</tspan></text>
  <text x="1000" y="308" font-size="11" fill="#9CA3AF">Jul 14</text>
  <text x="804" y="330" font-size="13" fill="#111827">"Solid dashboards. Wish the CSV export had more columns."</text>
  <text x="804" y="350" font-size="11" fill="#6B7280">blue-ocean-store.myshopify.com</text>

  <!-- review 3 -->
  <line x1="804" y1="374" x2="1376" y2="374" stroke="#F3F4F6" stroke-width="1"/>
  <text x="804" y="404" font-size="14" fill="#D97706">★★★<tspan fill="#E5E7EB">★★</tspan></text>
  <text x="1000" y="404" font-size="11" fill="#9CA3AF">Jul 06</text>
  <text x="804" y="426" font-size="13" fill="#111827">"Useful, but sync felt slow on my first import."</text>
  <text x="804" y="446" font-size="11" fill="#6B7280">quick-commerce.myshopify.com</text>

  <text x="804" y="490" font-size="12" fill="#5C6AC4">View all 128 →</text>

  <!-- annotations -->
  <text x="260" y="552" font-size="10" fill="#9CA3AF" font-style="italic">Rows show rating, snippet, store, date. Empty state: "No reviews yet". Error: LgServiceUnavailable. Loading: skeleton rows.</text>
</svg>
