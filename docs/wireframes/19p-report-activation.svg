<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>
  <text x="110" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>
  <rect x="24" y="88" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="101" font-size="13" fill="#6B7280">Dashboard</text>
  <rect x="24" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="137" font-size="13" fill="#6B7280">Subscriptions</text>
  <rect x="24" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="173" font-size="13" fill="#6B7280">Stores</text>
  <rect x="24" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="209" font-size="13" fill="#6B7280">Transactions</text>
  <rect x="24" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="245" font-size="13" fill="#6B7280">Events</text>
  <rect x="24" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="281" font-size="13" fill="#6B7280">Webhooks</text>
  <rect x="24" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="317" font-size="13" fill="#6B7280">Risk</text>
  <rect x="24" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="353" font-size="13" fill="#6B7280">Analytics</text>
  <rect x="12" y="368" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="24" y="376" width="16" height="16" rx="3" fill="#5C6AC4"/><text x="52" y="389" font-size="13" font-weight="600" fill="#5C6AC4">Reports</text>
  <rect x="24" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="425" font-size="13" fill="#6B7280">Earnings</text>
  <rect x="24" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="461" font-size="13" fill="#6B7280">Apps</text>
  <rect x="24" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="497" font-size="13" fill="#6B7280">API Keys</text>
  <rect x="24" y="520" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="533" font-size="13" fill="#6B7280">Insights</text>
  <rect x="24" y="556" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="569" font-size="13" fill="#6B7280">Settings</text>

  <!-- ==================== CONTENT ==================== -->
  <!-- Breadcrumb + title -->
  <text x="260" y="30" font-size="11" fill="#9CA3AF">Reports  ›  Growth</text>
  <text x="260" y="54" font-size="24" font-weight="bold" fill="#111827">Activation</text>
  <text x="260" y="76" font-size="13" fill="#6B7280">Install-to-paid conversion funnel — how installs become recurring revenue</text>

  <!-- Date range + Export + refresh (top-right) -->
  <rect x="1040" y="30" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1058" y="48" font-size="12" fill="#111827">Last 30 days ▾</text>
  <rect x="1204" y="30" width="120" height="28" rx="6" fill="#5C6AC4"/>
  <text x="1264" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF">Export CSV</text>
  <circle cx="1352" cy="44" r="16" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1352" y="50" text-anchor="middle" font-size="16" fill="#6B7280">&#8635;</text>

  <!-- App filter chip -->
  <rect x="260" y="92" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="278" y="110" font-size="12" fill="#111827">Revenue Tracker Pro ▾</text>

  <!-- Overall KPI card -->
  <rect x="260" y="132" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="284" y="160" font-size="12" fill="#6B7280">Overall Install → Paid</text>
  <text x="284" y="196" font-size="30" font-weight="700" fill="#059669">47%</text>
  <text x="284" y="216" font-size="11" fill="#9CA3AF">29 paid of 62 installs</text>

  <rect x="640" y="132" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="664" y="160" font-size="12" fill="#6B7280">Install → Subscription</text>
  <text x="664" y="196" font-size="30" font-weight="700" fill="#111827">61%</text>
  <text x="664" y="216" font-size="11" fill="#9CA3AF">38 started a subscription</text>

  <rect x="1020" y="132" width="380" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1044" y="160" font-size="12" fill="#6B7280">Subscription → Paid</text>
  <text x="1044" y="196" font-size="30" font-weight="700" fill="#111827">76%</text>
  <text x="1044" y="216" font-size="11" fill="#9CA3AF">29 reached recurring charge</text>

  <!-- Funnel card -->
  <rect x="260" y="244" width="1140" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="284" y="272" font-size="14" font-weight="600" fill="#111827">Activation funnel</text>
  <text x="284" y="290" font-size="11" fill="#9CA3AF">joins install events ↔ subscriptions</text>

  <!-- Stage 1: Installs (widest) -->
  <rect x="290" y="318" width="1080" height="66" rx="6" fill="#F0F1FF" stroke="#5C6AC4" stroke-width="1"/>
  <text x="314" y="348" font-size="14" font-weight="600" fill="#111827">Installs</text>
  <text x="314" y="370" font-size="11" fill="#6B7280">Stores that installed the app</text>
  <text x="1346" y="360" text-anchor="end" font-size="26" font-weight="700" fill="#5C6AC4">62</text>

  <!-- Conversion 1 → 2 -->
  <text x="830" y="404" text-anchor="middle" font-size="11" font-weight="500" fill="#6B7280">↓  61% convert</text>

  <!-- Stage 2: Started Subscription (narrower) -->
  <rect x="386" y="414" width="888" height="66" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="410" y="444" font-size="14" font-weight="600" fill="#111827">Started Subscription</text>
  <text x="410" y="466" font-size="11" fill="#6B7280">Selected a plan / began billing</text>
  <text x="1250" y="456" text-anchor="end" font-size="26" font-weight="700" fill="#059669">38</text>
  <text x="1250" y="474" text-anchor="end" font-size="11" fill="#6B7280">61% of installs</text>

  <!-- Conversion 2 → 3 -->
  <text x="830" y="500" text-anchor="middle" font-size="11" font-weight="500" fill="#6B7280">↓  76% convert</text>

  <!-- Stage 3: Paid / Recurring (narrowest) -->
  <rect x="482" y="510" width="696" height="66" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="506" y="540" font-size="14" font-weight="600" fill="#111827">Paid / Recurring</text>
  <text x="506" y="562" font-size="11" fill="#6B7280">Reached first recurring charge</text>
  <text x="1154" y="552" text-anchor="end" font-size="26" font-weight="700" fill="#059669">29</text>
  <text x="1154" y="570" text-anchor="end" font-size="11" fill="#6B7280">76% of subs</text>

  <text x="284" y="606" font-size="11" fill="#9CA3AF">End-to-end: 62 installs → 29 paid = 47% overall activation.</text>

  <!-- annotations -->
  <text x="260" y="664" font-size="10" fill="#9CA3AF" font-style="italic">Data source: joins install events ↔ subscriptions. Stage % = stage count ÷ prior stage; overall = paid ÷ installs.</text>
  <text x="260" y="680" font-size="10" fill="#9CA3AF" font-style="italic">Archetype E (funnel). Empty state: "No activation data yet". Error: LgServiceUnavailable. Loading: skeleton bars.</text>
  <text x="260" y="696" font-size="10" fill="#9CA3AF" font-style="italic">Standards: LgPage header (title/subtitle/refresh), app filter chip, cards rx=8 stroke #E5E7EB, status tokens (green paid).</text>
</svg>
