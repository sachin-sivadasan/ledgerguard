  <text x="260" y="758" font-size="10" fill="#9CA3AF" font-style="italic">Archetype A (hero KPIs → trend → table). Empty state: "No new subscriptions yet". Error: LgServiceUnavailable. Loading: skeleton rows.</text>
  <text x="260" y="774" font-size="10" fill="#9CA3AF" font-style="italic">Standards: LgPage header (title/subtitle/refresh), app filter chip, cards rx=8 stroke #E5E7EB, status tokens (green new / red churned).</text>
