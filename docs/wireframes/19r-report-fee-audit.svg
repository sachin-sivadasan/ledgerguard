  <text x="284" y="160" font-size="12" fill="#6B7280">Effective Take Rate</text>
  <text x="284" y="196" font-size="30" font-weight="700" fill="#111827">18.4%</text>
  <text x="284" y="216" font-size="11" fill="#9CA3AF">actual fees ÷ gross revenue</text>

  <rect x="640" y="132" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="664" y="160" font-size="12" fill="#6B7280">Expected Tier</text>
  <text x="664" y="196" font-size="30" font-weight="700" fill="#059669">15%</text>
  <text x="664" y="216" font-size="11" fill="#9CA3AF">contracted revenue-share rate</text>

  <rect x="1020" y="132" width="380" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1044" y="160" font-size="12" fill="#6B7280">Overcharged</text>
  <text x="1044" y="196" font-size="30" font-weight="700" fill="#DC2626">$142</text>
  <text x="1044" y="216" font-size="11" fill="#9CA3AF">excess fees above expected 15% tier</text>

  <!-- Callout box -->
  <rect x="260" y="244" width="1140" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="284" y="268" font-size="14" font-weight="600" fill="#DC2626">⚠  You may be owed $142 in over-deducted revenue share.</text>
  <text x="284" y="286" font-size="11" fill="#6B7280">2 of 4 charges were deducted above the contracted 15% tier. Review flagged rows and open a Partner support case.</text>

  <!-- Table -->
  <text x="260" y="330" font-size="16" font-weight="600" fill="#111827">Fee verification by charge</text>
  <!-- table header -->
  <rect x="260" y="342" width="1140" height="34" rx="8" fill="#F3F4F6"/>
  <text x="284" y="364" font-size="11" font-weight="600" fill="#6B7280">CHARGE / STORE</text>
  <text x="620" y="364" font-size="11" font-weight="600" fill="#6B7280">GROSS</text>
  <text x="740" y="364" font-size="11" font-weight="600" fill="#6B7280">EXPECTED FEE (15%)</text>
  <text x="960" y="364" font-size="11" font-weight="600" fill="#6B7280">ACTUAL FEE</text>
  <text x="1110" y="364" font-size="11" font-weight="600" fill="#6B7280">DELTA</text>
  <text x="1240" y="364" font-size="11" font-weight="600" fill="#6B7280">FLAG</text>

  <!-- row 1 (match) -->
  <line x1="260" y1="412" x2="1400" y2="412" stroke="#F3F4F6" stroke-width="1"/>
  <text x="284" y="402" font-size="13" font-weight="500" fill="#111827">acme-widgets.myshopify.com</text>
  <text x="620" y="402" font-size="13" fill="#111827">$490</text>
  <text x="740" y="402" font-size="13" fill="#6B7280">$73.50</text>
  <text x="960" y="402" font-size="13" fill="#111827">$73.50</text>
  <text x="1110" y="402" font-size="13" fill="#6B7280">$0.00</text>
  <rect x="1240" y="388" width="110" height="22" rx="11" fill="#ECFDF5"/><text x="1295" y="403" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">✓ Match</text>

  <!-- row 2 (overcharged) -->
  <line x1="260" y1="450" x2="1400" y2="450" stroke="#F3F4F6" stroke-width="1"/>
  <text x="284" y="440" font-size="13" font-weight="500" fill="#111827">blue-ocean-store.myshopify.com</text>
  <text x="620" y="440" font-size="13" fill="#111827">$390</text>
  <text x="740" y="440" font-size="13" fill="#6B7280">$58.50</text>
  <text x="960" y="440" font-size="13" fill="#111827">$140.40</text>
  <text x="1110" y="440" font-size="13" font-weight="600" fill="#DC2626">+$81.90</text>
  <rect x="1240" y="426" width="140" height="22" rx="11" fill="#FEF2F2"/><text x="1310" y="441" text-anchor="middle" font-size="11" font-weight="500" fill="#DC2626">⚠ Overcharged</text>

  <!-- row 3 (match) -->
  <line x1="260" y1="488" x2="1400" y2="488" stroke="#F3F4F6" stroke-width="1"/>
  <text x="284" y="478" font-size="13" font-weight="500" fill="#111827">quick-commerce.myshopify.com</text>
  <text x="620" y="478" font-size="13" fill="#111827">$290</text>
  <text x="740" y="478" font-size="13" fill="#6B7280">$43.50</text>
  <text x="960" y="478" font-size="13" fill="#111827">$43.50</text>
  <text x="1110" y="478" font-size="13" fill="#6B7280">$0.00</text>
  <rect x="1240" y="464" width="110" height="22" rx="11" fill="#ECFDF5"/><text x="1295" y="479" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">✓ Match</text>

  <!-- row 4 (overcharged) -->
  <line x1="260" y1="526" x2="1400" y2="526" stroke="#F3F4F6" stroke-width="1"/>
  <text x="284" y="516" font-size="13" font-weight="500" fill="#111827">green-leaf-goods.myshopify.com</text>
  <text x="620" y="516" font-size="13" fill="#111827">$240</text>
  <text x="740" y="516" font-size="13" fill="#6B7280">$36.00</text>
  <text x="960" y="516" font-size="13" fill="#111827">$96.10</text>
  <text x="1110" y="516" font-size="13" font-weight="600" fill="#DC2626">+$60.10</text>
  <rect x="1240" y="502" width="140" height="22" rx="11" fill="#FEF2F2"/><text x="1310" y="517" text-anchor="middle" font-size="11" font-weight="500" fill="#DC2626">⚠ Overcharged</text>

  <text x="284" y="558" font-size="12" fill="#5C6AC4">View full fee ledger →</text>

  <!-- annotations -->
  <text x="260" y="672" font-size="10" fill="#9CA3AF" font-style="italic">Data source: fee_verification_service. Compares actual Shopify-deducted fees against the contracted revenue-share tier per charge.</text>
  <text x="260" y="688" font-size="10" fill="#9CA3AF" font-style="italic">Archetype F · Reconciliation. Delta = Actual Fee − Expected Fee. Flag = ✓ Match (green) when |delta| ≈ 0, ⚠ Overcharged (red) otherwise.</text>
  <text x="260" y="704" font-size="10" fill="#9CA3AF" font-style="italic">Standards: LgPage header (title/subtitle/refresh), app filter chip, cards rx=8 stroke #E5E7EB, status color tokens (green/amber/red).</text>
</svg>
