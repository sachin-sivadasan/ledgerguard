<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>
  <text x="110" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>
  <rect x="24" y="88" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="101" font-size="13" fill="#6B7280">Dashboard</text>
  <rect x="24" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="137" font-size="13" fill="#6B7280">Subscriptions</text>
  <rect x="24" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="173" font-size="13" fill="#6B7280">Stores</text>
  <rect x="24" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="209" font-size="13" fill="#6B7280">Transactions</text>
  <rect x="24" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="245" font-size="13" fill="#6B7280">Events</text>
  <rect x="24" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="281" font-size="13" fill="#6B7280">Webhooks</text>
  <rect x="24" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="317" font-size="13" fill="#6B7280">Risk</text>
  <rect x="24" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="353" font-size="13" fill="#6B7280">Analytics</text>
  <rect x="12" y="368" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="24" y="376" width="16" height="16" rx="3" fill="#5C6AC4"/><text x="52" y="389" font-size="13" font-weight="600" fill="#5C6AC4">Reports</text>
  <rect x="24" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="425" font-size="13" fill="#6B7280">Earnings</text>
  <rect x="24" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="461" font-size="13" fill="#6B7280">Apps</text>
  <rect x="24" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="497" font-size="13" fill="#6B7280">API Keys</text>
  <rect x="24" y="520" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="533" font-size="13" fill="#6B7280">Insights</text>
  <rect x="24" y="556" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="52" y="569" font-size="13" fill="#6B7280">Settings</text>

  <!-- ==================== CONTENT ==================== -->
  <!-- Breadcrumb + title -->
  <text x="260" y="30" font-size="11" fill="#9CA3AF">Reports  ›  Guard</text>
  <text x="260" y="54" font-size="24" font-weight="bold" fill="#111827">Ledger Reconciliation</text>
  <text x="260" y="76" font-size="13" fill="#6B7280">Our recomputed ledger vs Shopify's figures</text>

  <!-- Date range + Export + refresh (top-right) -->
  <rect x="1040" y="30" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1058" y="48" font-size="12" fill="#111827">Last 30 days ▾</text>
  <rect x="1204" y="30" width="120" height="28" rx="6" fill="#5C6AC4"/>
  <text x="1264" y="48" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF">Export CSV</text>
  <circle cx="1352" cy="44" r="16" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1352" y="50" text-anchor="middle" font-size="16" fill="#6B7280">&#8635;</text>

  <!-- App filter chip -->
  <rect x="260" y="92" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="278" y="110" font-size="12" fill="#111827">Revenue Tracker Pro ▾</text>

  <!-- Hero KPI cards -->
  <rect x="260" y="132" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="284" y="160" font-size="12" fill="#6B7280">Recomputed Total</text>
  <text x="284" y="196" font-size="30" font-weight="700" fill="#111827">$54,342</text>
  <text x="284" y="216" font-size="11" fill="#9CA3AF">deterministic rebuild from raw transactions</text>

  <rect x="640" y="132" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="664" y="160" font-size="12" fill="#6B7280">Shopify Total</text>
  <text x="664" y="196" font-size="30" font-weight="700" fill="#111827">$54,200</text>
  <text x="664" y="216" font-size="11" fill="#9CA3AF">figure reported by Shopify Partner API</text>

  <rect x="1020" y="132" width="380" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1044" y="160" font-size="12" fill="#6B7280">Discrepancy</text>
  <text x="1044" y="196" font-size="30" font-weight="700" fill="#DC2626">$142</text>
  <text x="1044" y="216" font-size="11" fill="#9CA3AF">recomputed − Shopify (net difference)</text>

  <!-- Note box -->
  <rect x="260" y="244" width="1140" height="44" rx="8" fill="#F0F1FF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="284" y="271" font-size="12" fill="#5C6AC4">Deterministic recompute — same input → same output. Ledger is rebuilt from immutable raw transactions on every sync.</text>

  <!-- Table -->
  <text x="260" y="322" font-size="16" font-weight="600" fill="#111827">Line-item reconciliation</text>
  <!-- table header -->
  <rect x="260" y="334" width="1140" height="34" rx="8" fill="#F3F4F6"/>
  <text x="284" y="356" font-size="11" font-weight="600" fill="#6B7280">METRIC</text>
  <text x="620" y="356" font-size="11" font-weight="600" fill="#6B7280">OUR VALUE</text>
  <text x="880" y="356" font-size="11" font-weight="600" fill="#6B7280">SHOPIFY VALUE</text>
  <text x="1130" y="356" font-size="11" font-weight="600" fill="#6B7280">DELTA</text>
  <text x="1260" y="356" font-size="11" font-weight="600" fill="#6B7280">FLAG</text>

  <!-- row 1 MRR (match) -->
  <line x1="260" y1="404" x2="1400" y2="404" stroke="#F3F4F6" stroke-width="1"/>
  <text x="284" y="394" font-size="13" font-weight="500" fill="#111827">MRR (Recurring)</text>
  <text x="620" y="394" font-size="13" fill="#111827">$38,900</text>
  <text x="880" y="394" font-size="13" fill="#111827">$38,900</text>
  <text x="1130" y="394" font-size="13" fill="#6B7280">$0</text>
  <rect x="1260" y="380" width="90" height="22" rx="11" fill="#ECFDF5"/><text x="1305" y="395" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">✓ OK</text>

  <!-- row 2 Usage (match) -->
  <line x1="260" y1="442" x2="1400" y2="442" stroke="#F3F4F6" stroke-width="1"/>
  <text x="284" y="432" font-size="13" font-weight="500" fill="#111827">Usage Revenue</text>
  <text x="620" y="432" font-size="13" fill="#111827">$9,842</text>
  <text x="880" y="432" font-size="13" fill="#111827">$9,842</text>
  <text x="1130" y="432" font-size="13" fill="#6B7280">$0</text>
  <rect x="1260" y="418" width="90" height="22" rx="11" fill="#ECFDF5"/><text x="1305" y="433" text-anchor="middle" font-size="11" font-weight="500" fill="#059669">✓ OK</text>

  <!-- row 3 Fees (discrepancy) -->
  <line x1="260" y1="480" x2="1400" y2="480" stroke="#F3F4F6" stroke-width="1"/>
  <text x="284" y="470" font-size="13" font-weight="500" fill="#111827">Fees</text>
  <text x="620" y="470" font-size="13" fill="#111827">−$8,142</text>
  <text x="880" y="470" font-size="13" fill="#111827">−$8,000</text>
  <text x="1130" y="470" font-size="13" font-weight="600" fill="#DC2626">−$142</text>
  <rect x="1260" y="456" width="130" height="22" rx="11" fill="#FEF2F2"/><text x="1325" y="471" text-anchor="middle" font-size="11" font-weight="500" fill="#DC2626">⚠ Discrepancy</text>

  <!-- row 4 Net (discrepancy) -->
  <line x1="260" y1="518" x2="1400" y2="518" stroke="#F3F4F6" stroke-width="1"/>
  <text x="284" y="508" font-size="13" font-weight="500" fill="#111827">Net</text>
  <text x="620" y="508" font-size="13" font-weight="600" fill="#111827">$54,342</text>
  <text x="880" y="508" font-size="13" font-weight="600" fill="#111827">$54,200</text>
  <text x="1130" y="508" font-size="13" font-weight="600" fill="#DC2626">+$142</text>
  <rect x="1260" y="494" width="130" height="22" rx="11" fill="#FEF2F2"/><text x="1325" y="509" text-anchor="middle" font-size="11" font-weight="500" fill="#DC2626">⚠ Discrepancy</text>

  <text x="284" y="550" font-size="12" fill="#5C6AC4">View rebuild audit trail →</text>

  <!-- annotations -->
  <text x="260" y="672" font-size="10" fill="#9CA3AF" font-style="italic">Data source: ledger_service (deterministic rebuild). Our Value is recomputed from immutable raw transactions; Shopify Value is the Partner API figure.</text>
  <text x="260" y="688" font-size="10" fill="#9CA3AF" font-style="italic">Archetype F · Reconciliation. Delta = Our Value − Shopify Value. Flag = ✓ OK (green) when delta = 0, ⚠ Discrepancy (red) otherwise.</text>
  <text x="260" y="704" font-size="10" fill="#9CA3AF" font-style="italic">Standards: LgPage header (title/subtitle/refresh), app filter chip, cards rx=8 stroke #E5E7EB, status color tokens (green/amber/red).</text>
</svg>
