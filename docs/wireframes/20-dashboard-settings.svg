<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- ==================== LEFT SIDEBAR ==================== -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="20" width="180" height="40" rx="4" fill="none"/>
  <circle cx="38" cy="40" r="10" fill="#5C6AC4" opacity="0.2"/>
  <circle cx="38" cy="40" r="6" fill="#5C6AC4"/>
  <text x="56" y="45" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>

  <!-- Nav Items -->
  <!-- Dashboard -->
  <rect x="24" y="88" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="101" font-size="13" fill="#6B7280">Dashboard</text>

  <!-- Subscriptions -->
  <rect x="24" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="137" font-size="13" fill="#6B7280">Subscriptions</text>

  <!-- Stores -->
  <rect x="24" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="173" font-size="13" fill="#6B7280">Stores</text>

  <!-- Transactions -->
  <rect x="24" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/>
