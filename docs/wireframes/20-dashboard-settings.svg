  <rect x="24" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="425" font-size="13" fill="#6B7280">Apps</text>

  <!-- API Keys -->
  <rect x="24" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="461" font-size="13" fill="#6B7280">API Keys</text>

