  <!-- Events -->
  <rect x="24" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="245" font-size="13" fill="#6B7280">Events</text>

  <!-- Webhooks -->
  <rect x="24" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="281" font-size="13" fill="#6B7280">Webhooks</text>

  <!-- Risk -->
  <rect x="24" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="317" font-size="13" fill="#6B7280">Risk</text>

  <!-- Analytics -->
  <rect x="24" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="353" font-size="13" fill="#6B7280">Analytics</text>

  <!-- Earnings -->
  <rect x="24" y="376" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="48" y="389" font-size="13" fill="#6B7280">Earnings</text>

