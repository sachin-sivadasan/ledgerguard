  <text x="44" y="245" font-size="13" fill="#6B7280">Events</text>

  <rect x="12" y="260" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="281" font-size="13" fill="#6B7280">Webhooks</text>

  <rect x="12" y="296" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="317" font-size="13" fill="#6B7280">Risk</text>

  <rect x="12" y="332" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="353" font-size="13" fill="#6B7280">Analytics</text>

  <rect x="12" y="368" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="376" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="389" font-size="13" fill="#6B7280">Earnings</text>

  <rect x="12" y="404" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="425" font-size="13" fill="#6B7280">Apps</text>

  <rect x="12" y="440" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="461" font-size="13" fill="#6B7280">API Keys</text>

  <rect x="12" y="476" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="497" font-size="13" fill="#6B7280">Insights</text>

  <!-- Settings (Active) -->
  <rect x="12" y="512" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="20" y="520" width="16" height="16" rx="3" fill="#5C6AC4"/>
  <text x="44" y="533" font-size="13" font-weight="600" fill="#5C6AC4">Settings</text>

  <!-- Content Area -->
  <!-- Back Arrow -->
  <g transform="translate(260, 28)">
    <path d="M12 0 L0 10 L12 20" stroke="#6B7280" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Page Title -->
  <text x="290" y="44" font-size="24" font-weight="bold" fill="#111827">Team</text>
  <text x="290" y="66" font-size="13" fill="#6B7280">3/5 members  &#xB7;  Starter plan</text>

  <!-- Invite Member Button (top right) -->
  <rect x="700" y="22" width="140" height="36" rx="8" fill="#5C6AC4"/>
  <text x="724" y="45" font-size="13" font-weight="600" fill="#FFFFFF">+ Invite Member</text>

  <!-- Member 1 Card -->
  <rect x="260" y="90" width="580" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Purple Avatar -->
  <circle cx="300" cy="126" r="20" fill="#8B5CF6"/>
  <text x="291" y="132" font-size="12" font-weight="600" fill="#FFFFFF">JD</text>
  <!-- Name & Email -->
  <text x="332" y="120" font-size="14" font-weight="600" fill="#111827">John Doe</text>
  <text x="332" y="140" font-size="12" fill="#6B7280">john@example.com</text>
  <!-- Owner Badge -->
  <rect x="748" y="114" width="60" height="24" rx="12" fill="#F0F1FF"/>
  <text x="759" y="130" font-size="11" font-weight="500" fill="#5C6AC4">Owner</text>

  <!-- Member 2 Card -->
  <rect x="260" y="174" width="580" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Blue Avatar -->
  <circle cx="300" cy="210" r="20" fill="#3B82F6"/>
  <text x="291" y="216" font-size="12" font-weight="600" fill="#FFFFFF">AS</text>
  <!-- Name & Email -->
  <text x="332" y="204" font-size="14" font-weight="600" fill="#111827">Alice Smith</text>
  <text x="332" y="224" font-size="12" fill="#6B7280">alice@example.com</text>
  <!-- Admin Badge -->
  <rect x="748" y="198" width="56" height="24" rx="12" fill="#DBEAFE"/>
  <text x="759" y="214" font-size="11" font-weight="500" fill="#2563EB">Admin</text>
  <!-- More Menu -->
  <text x="820" y="216" font-size="18" fill="#9CA3AF">&#x22EE;</text>

  <!-- Member 3 Card -->
  <rect x="260" y="258" width="580" height="72" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Gray Avatar -->
  <circle cx="300" cy="294" r="20" fill="#9CA3AF"/>
  <text x="290" y="300" font-size="12" font-weight="600" fill="#FFFFFF">BM</text>
  <!-- Name & Email -->
  <text x="332" y="288" font-size="14" font-weight="600" fill="#111827">Bob Miller</text>
  <text x="332" y="308" font-size="12" fill="#6B7280">bob@example.com</text>
  <!-- Viewer Badge -->
  <rect x="748" y="282" width="60" height="24" rx="12" fill="#F3F4F6"/>
  <text x="757" y="298" font-size="11" font-weight="500" fill="#6B7280">Viewer</text>
  <!-- More Menu -->
  <text x="820" y="300" font-size="18" fill="#9CA3AF">&#x22EE;</text>
</svg>