<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F8F9FA"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="#FFFFFF"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Logo -->
  <rect x="20" y="20" width="180" height="40" fill="none"/>
  <text x="30" y="45" font-size="14" font-weight="bold" fill="#5C6AC4">LedgerGuard</text>

  <!-- Nav Items -->
  <rect x="12" y="80" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="88" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="101" font-size="13" fill="#6B7280">Dashboard</text>

  <rect x="12" y="116" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="124" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="137" font-size="13" fill="#6B7280">Subscriptions</text>

  <rect x="12" y="152" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="160" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="173" font-size="13" fill="#6B7280">Stores</text>

  <rect x="12" y="188" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="196" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="209" font-size="13" fill="#6B7280">Transactions</text>

  <rect x="12" y="224" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="232" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="245" font-size="13" fill="#6B7280">Events</text>

  <rect x="12" y="260" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="268" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="281" font-size="13" fill="#6B7280">Webhooks</text>

  <rect x="12" y="296" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="304" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="317" font-size="13" fill="#6B7280">Risk</text>

  <rect x="12" y="332" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="340" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="353" font-size="13" fill="#6B7280">Analytics</text>

  <rect x="12" y="368" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="376" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="389" font-size="13" fill="#6B7280">Earnings</text>

  <rect x="12" y="404" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="412" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="425" font-size="13" fill="#6B7280">Apps</text>

  <rect x="12" y="440" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="448" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="461" font-size="13" fill="#6B7280">API Keys</text>

  <rect x="12" y="476" width="196" height="32" rx="6" fill="none"/>
  <rect x="20" y="484" width="16" height="16" rx="3" fill="#E5E7EB"/>
  <text x="44" y="497" font-size="13" fill="#6B7280">Insights</text>

  <!-- Settings (Active) -->
  <rect x="12" y="512" width="196" height="32" rx="6" fill="#F0F1FF"/>
  <rect x="20" y="520" width="16" height="16" rx="3" fill="#5C6AC4"/>
  <text x="44" y="533" font-size="13" font-weight="600" fill="#5C6AC4">Settings</text>

  <!-- Content Area -->
  <!-- Back Arrow -->
  <g transform="translate(260, 28)">
    <path d="M12 0 L0 10 L12 20" stroke="#6B7280" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Page Title -->
  <text x="290" y="44" font-size="24" font-weight="bold" fill="#111827">Audit Log</text>
  <text x="290" y="66" font-size="13" fill="#6B7280">Acme Inc</text>

  <!-- Entry 1: Member invited (green) -->
  <rect x="260" y="90" width="580" height="68" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="292" cy="124" r="16" fill="#ECFDF5"/>
  <circle cx="292" cy="124" r="6" fill="#10B981"/>
  <text x="320" y="116" font-size="14" font-weight="600" fill="#111827">Member invited</text>
  <text x="320" y="136" font-size="12" fill="#6B7280">alice@example.com</text>
  <text x="780" y="124" font-size="12" fill="#9CA3AF" text-anchor="end">2 hours ago</text>

  <!-- Entry 2: Role changed (blue) -->
  <rect x="260" y="170" width="580" height="68" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="292" cy="204" r="16" fill="#DBEAFE"/>
  <circle cx="292" cy="204" r="6" fill="#3B82F6"/>
  <text x="320" y="196" font-size="14" font-weight="600" fill="#111827">Role changed</text>
  <text x="320" y="216" font-size="12" fill="#6B7280">bob@example.com  &#x2192;  Admin</text>
  <text x="780" y="204" font-size="12" fill="#9CA3AF" text-anchor="end">Yesterday</text>

  <!-- Entry 3: Settings updated (orange) -->
  <rect x="260" y="250" width="580" height="68" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="292" cy="284" r="16" fill="#FEF3C7"/>
  <circle cx="292" cy="284" r="6" fill="#F59E0B"/>
  <text x="320" y="276" font-size="14" font-weight="600" fill="#111827">Settings updated</text>
  <text x="320" y="296" font-size="12" fill="#6B7280">Sync frequency changed</text>
  <text x="780" y="284" font-size="12" fill="#9CA3AF" text-anchor="end">2 days ago</text>

  <!-- Entry 4: Member removed (red) -->
  <rect x="260" y="330" width="580" height="68" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="292" cy="364" r="16" fill="#FEE2E2"/>
  <circle cx="292" cy="364" r="6" fill="#EF4444"/>
  <text x="320" y="356" font-size="14" font-weight="600" fill="#111827">Member removed</text>
  <text x="320" y="376" font-size="12" fill="#6B7280">charlie@example.com</text>
  <text x="780" y="364" font-size="12" fill="#9CA3AF" text-anchor="end">3 days ago</text>

  <!-- Entry 5: Organization updated (blue) -->
  <rect x="260" y="410" width="580" height="68" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="292" cy="444" r="16" fill="#DBEAFE"/>
  <circle cx="292" cy="444" r="6" fill="#3B82F6"/>
  <text x="320" y="436" font-size="14" font-weight="600" fill="#111827">Organization updated</text>
  <text x="320" y="456" font-size="12" fill="#6B7280">Name changed</text>
  <text x="780" y="444" font-size="12" fill="#9CA3AF" text-anchor="end">1 week ago</text>

  <!-- Entry 6: Organization created (green) -->
  <rect x="260" y="490" width="580" height="68" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="292" cy="524" r="16" fill="#ECFDF5"/>
  <circle cx="292" cy="524" r="6" fill="#10B981"/>
  <text x="320" y="516" font-size="14" font-weight="600" fill="#111827">Organization created</text>
  <text x="320" y="536" font-size="12" fill="#6B7280">Acme Inc</text>
  <text x="780" y="524" font-size="12" fill="#9CA3AF" text-anchor="end">2 weeks ago</text>
</svg>