persona:
  name: "Whale Partner"
  description: "5 apps, 50K stores, ~1M transactions — load testing persona"

apps:
  - id: "gid://partners/App/5001"
    name: "MegaInventory"
  - id: "gid://partners/App/5002"
    name: "ShipFleet"
  - id: "gid://partners/App/5003"
    name: "LoyaltyEngine"
  - id: "gid://partners/App/5004"
    name: "AnalyticsPro"
  - id: "gid://partners/App/5005"
    name: "ReviewMaster"

# Shops, subscriptions, and usage charges are generated programmatically
# by DataStore.expand_generated() to avoid a massive YAML file.
# Transaction math: 50K shops × (0.75×12 + 0.15×8 + 0.10×4) ≈ 510K sub txns + ~500K usage txns ≈ 1M total
generated:
  shops: 50000
  distribution:
    - app_index: 0
      ratio: 0.30
      plans:
        - { name: "Basic", price: 9.99, pct: 0.4 }
        - { name: "Pro", price: 29.99, pct: 0.4 }
        - { name: "Enterprise", price: 99.99, pct: 0.2 }
    - app_index: 1
      ratio: 0.25
      plans:
        - { name: "Starter", price: 14.99, pct: 0.5 }
        - { name: "Growth", price: 49.99, pct: 0.5 }
    - app_index: 2
      ratio: 0.20
      plans:
        - { name: "Free", price: 0.00, pct: 0.3 }
        - { name: "Premium", price: 19.99, pct: 0.7 }
    - app_index: 3
      ratio: 0.15
      plans:
        - { name: "Basic", price: 24.99, pct: 0.6 }
        - { name: "Pro", price: 79.99, pct: 0.4 }
    - app_index: 4
      ratio: 0.10
      plans:
        - { name: "Standard", price: 12.99, pct: 1.0 }
  status_mix:
    active: 0.75
    frozen: 0.15
    cancelled: 0.10

usage_charges:
  - app_index: 1
    amount_range: [5.00, 50.00]
    shop_ratio: 0.3
  - app_index: 3
    amount_range: [0.50, 5.00]
    shop_ratio: 0.2
